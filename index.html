<style>
:root{

}

.hbtn{background:none;color:var(--pri);font-size:16px;padding:6px 8px;min-width:64px;text-align:left}

.finca .ic{width:44px;height:44px;border-radius:10px;background:var(--pri2);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}

<script>
'use strict';
/* =========================================================
   LIMPFINC · F1 — Fincas, linde, exclusiones, área
   ========================================================= */
const VERSION = 'F2 · 0.2.0';

/* ---------- Ajustes por defecto ---------- */
const DEF = {
  tractor:'New Holland TN95F', potencia:95,
  radioGiro:4.0, marchaAtras:true,
  aperoNombre:'Desbrozadora de cadenas', aperoAncho:1.70, offsetApero:2.0,
  velocidad:2.5, consumo:5.0, solape:0.10, umbralDesv:1.0,
  anchoTractor:1.70, longTractorApero:5.0,
  umbralPrecision:8, holguraLinde:0.5,
  mallaX:3.5, mallaY:3.5, holguraTronco:0.30,
  velocidadGiro:3.0, velocidadTraslado:5.0, tCambioSentido:4, tManiobra:20, tEsquina:15, margenObstaculo:0.30
};
const SET_FIELDS = [
  ['Tractor',[['tractor','Modelo','text'],['potencia','Potencia (CV)'],['anchoTractor','Ancho tractor (m)'],
    ['longTractorApero','Longitud tractor + apero (m)'],['radioGiro','Radio de giro mínimo (m)'],['marchaAtras','Maniobras marcha atrás','bool']]],
  ['Apero',[['aperoNombre','Apero','text'],['aperoAncho','Ancho de trabajo (m)'],['offsetApero','iPhone → centro apero (m)']]],
  ['Trabajo',[['velocidad','Velocidad por defecto (km/h)'],['consumo','Consumo (L/h)'],['solape','Solape entre pasadas (m)'],['umbralDesv','Umbral desviación (m)']]],
  ['Planificación',[['velocidadGiro','Velocidad en giros (km/h)'],['velocidadTraslado','Velocidad en traslados (km/h)'],['tCambioSentido','Tiempo cambio de sentido (s)'],
    ['tManiobra','Maniobra al iniciar traslado (s)'],['tEsquina','Maniobra en esquina (s)'],['margenObstaculo','Margen a exclusiones (m)']]],
  ['Medición GPS',[['umbralPrecision','Descartar puntos con precisión peor que (m)'],['holguraLinde','Holgura lateral tractor–linde (m)']]],
  ['Monte',[['mallaX','Separación entre filas (m)'],['mallaY','Separación en fila (m)'],['holguraTronco','Holgura al tronco (m)']]]
];

/* ---------- IndexedDB ---------- */
const DB = (() => {
  let db;
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('limpfinc', 1);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('fincas')) d.createObjectStore('fincas', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
    };
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
  const tx = (st, mode, fn) => new Promise((res, rej) => {
    const t = db.transaction(st, mode), s = t.objectStore(st); const q = fn(s);
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error);
  });
  return {
    open,
    all: () => tx('fincas', 'readonly', s => s.getAll()),
    get: id => tx('fincas', 'readonly', s => s.get(id)),
    put: f => tx('fincas', 'readwrite', s => s.put(f)),
    del: id => tx('fincas', 'readwrite', s => s.delete(id)),
    kvGet: k => tx('kv', 'readonly', s => s.get(k)),
    kvPut: (k, v) => tx('kv', 'readwrite', s => s.put(v, k))
  };
})();

/* ---------- Geometría (plano local métrico, WGS84) ---------- */
const D2R = Math.PI / 180;
const Geo = {
  proj(lat0, lon0) {
    const a = 6378137, e2 = 6.69437999014e-3, s = Math.sin(lat0 * D2R), w = 1 - e2 * s * s;
    const N = a / Math.sqrt(w), M = a * (1 - e2) / (w * Math.sqrt(w));
    const kx = N * Math.cos(lat0 * D2R) * D2R, ky = M * D2R;
    return { fwd: (lat, lon) => [(lon - lon0) * kx, (lat - lat0) * ky], inv: (x, y) => [lat0 + y / ky, lon0 + x / kx] };
  },
  projFor(ll) { // ll: [[lat,lon],...]
    let la = 0, lo = 0; ll.forEach(p => { la += p[0]; lo += p[1]; });
    return Geo.proj(la / ll.length, lo / ll.length);
  },
  toXY(ll, P) { return ll.map(p => P.fwd(p[0], p[1])); },
  toLL(xy, P) { return xy.map(p => P.inv(p[0], p[1])); },
  dist: (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]),
  signedArea(xy) { let s = 0; for (let i = 0, n = xy.length; i < n; i++) { const a = xy[i], b = xy[(i + 1) % n]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; },
  area: xy => Math.abs(Geo.signedArea(xy)),
  perim(xy, closed = true) { let s = 0; for (let i = 0; i < xy.length - (closed ? 0 : 1); i++) s += Geo.dist(xy[i], xy[(i + 1) % xy.length]); return s; },
  lenLL(ll) { if (ll.length < 2) return 0; const P = Geo.projFor(ll); return Geo.perim(Geo.toXY(ll, P), false); },
  areaLL(ll) { if (ll.length < 3) return 0; const P = Geo.projFor(ll); return Geo.area(Geo.toXY(ll, P)); },
  perimLL(ll) { if (ll.length < 2) return 0; const P = Geo.projFor(ll); return Geo.perim(Geo.toXY(ll, P), true); },
  decimate(xy, dmin) { if (!xy.length) return []; const o = [xy[0]]; for (const p of xy) if (Geo.dist(o[o.length - 1], p) >= dmin) o.push(p); return o; },
  smooth(xy, k) { // media móvil abierta, ventana 2k+1
    const n = xy.length; if (n < 2 * k + 1) return xy.slice();
    return xy.map((_, i) => { let sx = 0, sy = 0, c = 0; for (let j = Math.max(0, i - k); j <= Math.min(n - 1, i + k); j++) { sx += xy[j][0]; sy += xy[j][1]; c++; } return [sx / c, sy / c]; });
  },
  dp(xy, eps) { // Douglas-Peucker
    if (xy.length < 3) return xy.slice();
    const keep = new Uint8Array(xy.length); keep[0] = keep[xy.length - 1] = 1;
    const st = [[0, xy.length - 1]];
    while (st.length) {
      const [i, j] = st.pop(); let dm = 0, im = -1; const a = xy[i], b = xy[j];
      const L = Geo.dist(a, b) || 1e-9;
      for (let k = i + 1; k < j; k++) { const p = xy[k]; const d = Math.abs((b[0] - a[0]) * (a[1] - p[1]) - (a[0] - p[0]) * (b[1] - a[1])) / L; if (d > dm) { dm = d; im = k; } }
      if (dm > eps && im > 0) { keep[im] = 1; st.push([i, im], [im, j]); }
    }
    return xy.filter((_, i) => keep[i]);
  },
  dpClosed(xy, eps) { // anillo cerrado: se parte por el punto más alejado del primero
    if (xy.length < 4) return xy.slice();
    let k = 1, dm = 0; xy.forEach((p, i) => { const d = Geo.dist(xy[0], p); if (d > dm) { dm = d; k = i; } });
    const a = Geo.dp(xy.slice(0, k + 1), eps), b = Geo.dp([...xy.slice(k), xy[0]], eps);
    return [...a.slice(0, -1), ...b.slice(0, -1)];
  },
  mergeClose(xy, dmin) { // fusiona vértices a menos de dmin
    const o = [];
    for (const p of xy) { const q = o[o.length - 1]; if (q && Geo.dist(p, q) < dmin) { q[0] = (q[0] + p[0]) / 2; q[1] = (q[1] + p[1]) / 2; } else o.push(p.slice()); }
    while (o.length > 3 && Geo.dist(o[0], o[o.length - 1]) < dmin) o.pop();
    return o;
  },
  ccw(xy) { return Geo.signedArea(xy) < 0 ? xy.slice().reverse() : xy; },
  offsetOut(xy, d) { // desplaza polígono CCW hacia fuera d metros (inglete limitado)
    const n = xy.length, o = [];
    for (let i = 0; i < n; i++) {
      const p0 = xy[(i - 1 + n) % n], p1 = xy[i], p2 = xy[(i + 1) % n];
      const n1 = Geo.nrm([p1[1] - p0[1], -(p1[0] - p0[0])]), n2 = Geo.nrm([p2[1] - p1[1], -(p2[0] - p1[0])]);
      let m = Geo.nrm([n1[0] + n2[0], n1[1] + n2[1]]); const c = m[0] * n1[0] + m[1] * n1[1];
      const f = d / Math.max(c, 0.5);
      o.push([p1[0] + m[0] * f, p1[1] + m[1] * f]);
    }
    return o;
  },
  nrm(v) { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; },
  segX(a, b, c, d) {
    const o = (p, q, r) => Math.sign((q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]));
    return o(a, b, c) * o(a, b, d) < 0 && o(c, d, a) * o(c, d, b) < 0;
  },
  selfIntersects(xy) {
    const n = xy.length;
    for (let i = 0; i < n; i++) for (let j = i + 2; j < n; j++) {
      if (i === 0 && j === n - 1) continue;
      if (Geo.segX(xy[i], xy[(i + 1) % n], xy[j], xy[(j + 1) % n])) return true;
    }
    return false;
  },
  inPoly(p, xy) {
    let c = false;
    for (let i = 0, j = xy.length - 1; i < xy.length; j = i++) {
      const a = xy[i], b = xy[j];
      if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
    }
    return c;
  }
};

/* Proceso de un recorrido GPS a polígono */
function processTrack(pts, mode, S) {
  const good = pts.filter(p => p.acc <= S.umbralPrecision);
  if (good.length < 5) return { error: 'Muy pocos puntos válidos (' + good.length + '). Revisa la precisión GPS.' };
  const ll = good.map(p => [p.lat, p.lon]);
  const P = Geo.projFor(ll);
  let xy = Geo.toXY(ll, P);
  xy = Geo.decimate(xy, 1.0);
  xy = Geo.smooth(xy, 2);
  // quitar cola que solapa el inicio
  while (xy.length > 4 && Geo.dist(xy[xy.length - 1], xy[0]) < 1.0) xy.pop();
  xy = Geo.dpClosed(xy, 1.0);
  xy = Geo.mergeClose(xy, 2.0);
  if (xy.length < 3) return { error: 'El recorrido no forma un polígono.' };
  xy = Geo.ccw(xy);
  let off = 0;
  if (mode === 'tractor') {
    off = S.anchoTractor / 2 + S.holguraLinde;
    xy = Geo.offsetOut(xy, off);
  }
  const gap = Geo.dist(good[0] && P.fwd(good[0].lat, good[0].lon), P.fwd(good[good.length - 1].lat, good[good.length - 1].lon));
  return {
    coords: Geo.toLL(xy, P), offset: off, gap,
    selfX: Geo.selfIntersects(xy),
    used: good.length, total: pts.length,
    accMed: good.reduce((s, p) => s + p.acc, 0) / good.length
  };
}

/* ---------- Utilidades UI ---------- */
const $ = id => document.getElementById(id);
const fmt = (v, d = 0) => v.toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtArea = m2 => m2 >= 10000 ? fmt(m2 / 10000, 3) + ' ha' : fmt(m2, 0) + ' m²';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function toast(msg, ms = 2500) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
function sheet(html, onReady) {
  const host = $('sheetHost');
  host.innerHTML = `<div class="sheetBg"></div><div class="sheet"><div class="grab"></div><button class="shX" aria-label="Cerrar">✕</button>${html}</div>`;
  host.querySelector('.sheetBg').onclick = closeSheet; host.querySelector('.shX').onclick = closeSheet;
  onReady && onReady(host.querySelector('.sheet'));
}
function closeSheet() { $('sheetHost').innerHTML = ''; }
function confirmSheet(msg, okTxt, cb, danger) {
  sheet(`<h3>${msg}</h3><div class="row" style="margin-top:12px"><button class="btn sec" id="cNo">Cancelar</button><button class="btn ${danger ? 'err' : ''}" id="cOk">${okTxt}</button></div>`,
    () => { $('cNo').onclick = closeSheet; $('cOk').onclick = () => { closeSheet(); cb(); }; });
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- Estado ---------- */
let S = { ...DEF };
let cur = null;           // finca abierta
let view = 'list';

/* =========================================================
   LISTA DE FINCAS
   ========================================================= */
async function showList() {
  view = 'list';
  setHeader('', 'LIMPFINC', '⚙︎', null, showSettings);
  $('vList').classList.remove('hidden'); $('bNueva').classList.remove('hidden');
  $('vSet').classList.add('hidden'); $('mapWrap').classList.add('hidden');
  const fs = (await DB.all()).sort((a, b) => b.mod - a.mod);
  const el = $('fincaList');
  if (!fs.length) { el.innerHTML = `<div class="empty">No hay fincas.<br>Pulsa «Nueva finca» para empezar.</div>`; return; }
  el.innerHTML = fs.map(f => {
    const a = fincaAreas(f);
    return `<div class="card finca" data-id="${f.id}">
      <div class="ic">${f.tipo === 'monte' ? '🌲' : '🌾'}</div>
      <div style="flex:1;min-width:0"><div class="t">${esc(f.nombre)}</div>
      <div class="s">${f.tipo === 'monte' ? 'Monte / plantación' : 'Abierta'} · ${f.linde ? fmtArea(a.neta) : 'sin linde'}${f.plan ? ' · plan ' + fmtH(f.plan.stats.t.total / 3600) + ' / ' + fmt(f.plan.stats.litros, 1) + ' L' : ''}</div></div>
      <div style="color:#c7c7cc;font-size:20px">›</div></div>`;
  }).join('');
  el.querySelectorAll('.finca').forEach(c => c.onclick = () => openFinca(c.dataset.id));
}

function setHeader(left, title, right, onL, onR) {
  $('hLeft').textContent = left; $('hTitle').textContent = title; $('hRight').textContent = right;
  $('hLeft').onclick = onL || null; $('hRight').onclick = onR || null;
}

$('bNueva').onclick = () => fincaForm(null);

function fincaForm(f) {
  const isNew = !f; f = f || { tipo: 'abierta', nombre: '' };
  sheet(`<h3>${isNew ? 'Nueva finca' : 'Editar finca'}</h3>
    <label class="f">Nombre</label><input class="inp" id="fNom" value="${esc(f.nombre)}" placeholder="p. ej. Leira do Souto">
    <label class="f">Tipo</label>
    <div class="seg" id="fTipo"><button data-v="abierta">🌾 Abierta</button><button data-v="monte">🌲 Monte / plantación</button></div>
    <label class="f">Referencia catastral (opcional)</label><input class="inp" id="fRef" value="${esc(f.refCat || '')}" placeholder="15001A00100001">
    <label class="f">Notas</label><input class="inp" id="fNot" value="${esc(f.notas || '')}">
    <div class="row" style="margin-top:14px">${isNew ? '' : '<button class="btn err" id="fDel">Eliminar</button>'}<button class="btn" id="fOk">${isNew ? 'Crear' : 'Guardar'}</button></div>`,
    () => {
      let tipo = f.tipo;
      const seg = $('fTipo'); const paint = () => seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === tipo));
      seg.querySelectorAll('button').forEach(b => b.onclick = () => { tipo = b.dataset.v; paint(); }); paint();
      $('fOk').onclick = async () => {
        const nombre = $('fNom').value.trim(); if (!nombre) { toast('Indica un nombre'); return; }
        const now = Date.now();
        const nf = isNew ? { id: uid(), creada: now, linde: null, exclusiones: [] } : f;
        Object.assign(nf, { nombre, tipo, refCat: $('fRef').value.trim(), notas: $('fNot').value.trim(), mod: now });
        await DB.put(nf); closeSheet();
        if (isNew) openFinca(nf.id); else { cur = nf; setHeader('‹ Fincas', nf.nombre, '⋯', showList, () => fincaForm(cur)); }
      };
      if (!isNew) $('fDel').onclick = () => confirmSheet(`¿Eliminar «${esc(f.nombre)}» y todos sus datos?`, 'Eliminar', async () => { await DB.del(f.id); cur = null; showList(); }, true);
    });
}

function fincaAreas(f) {
  const bruta = f.linde ? Geo.areaLL(f.linde.coords) : 0;
  const excl = (f.exclusiones || []).reduce((s, e) => s + Geo.areaLL(e.coords), 0);
  return { bruta, excl, neta: Math.max(0, bruta - excl), perim: f.linde ? Geo.perimLL(f.linde.coords) : 0 };
}

/* =========================================================
   AJUSTES
   ========================================================= */
function showSettings() {
  view = 'set';
  setHeader('‹ Fincas', 'Ajustes', '', showList);
  $('vList').classList.add('hidden'); $('bNueva').classList.add('hidden'); $('vSet').classList.remove('hidden');
  let h = '';
  for (const [g, fields] of SET_FIELDS) {
    h += `<div class="sgrp">${g}</div><div class="card">`;
    for (const [k, lbl, t] of fields) {
      if (t === 'bool') h += `<div class="srow"><span>${lbl}</span><input type="checkbox" data-k="${k}" ${S[k] ? 'checked' : ''} style="width:auto"></div>`;
      else h += `<div class="srow"><span>${lbl}</span><input class="inp" data-k="${k}" ${t === 'text' ? '' : 'inputmode="decimal"'} value="${esc(t === 'text' ? S[k] : String(S[k]).replace('.', ','))}"></div>`;
    }
    h += '</div>';
  }
  h += `<div class="sgrp">Datos</div><div class="card">
    <button class="btn sec" id="bExp" style="margin-bottom:8px">Exportar copia de seguridad (JSON)</button>
    <button class="btn sec" id="bImp" style="margin-bottom:8px">Importar copia de seguridad</button>
    <input type="file" id="fImp" accept=".json,application/json" class="hidden">
    <button class="btn sec" id="bDef">Restaurar valores por defecto</button></div>
    <div class="note" style="text-align:center">LIMPFINC ${VERSION}</div>`;
  $('setBody').innerHTML = h;
  $('setBody').querySelectorAll('[data-k]').forEach(inp => inp.onchange = async () => {
    const k = inp.dataset.k;
    if (inp.type === 'checkbox') S[k] = inp.checked;
    else if (typeof DEF[k] === 'string') S[k] = inp.value;
    else { const v = parseFloat(inp.value.replace(',', '.')); if (isFinite(v) && v >= 0) S[k] = v; else { toast('Valor no válido'); inp.value = String(S[k]).replace('.', ','); return; } }
    await DB.kvPut('settings', S); toast('Guardado', 900);
  });
  $('bDef').onclick = () => confirmSheet('¿Restaurar todos los ajustes por defecto?', 'Restaurar', async () => { S = { ...DEF }; await DB.kvPut('settings', S); showSettings(); });
  $('bExp').onclick = exportBackup;
  $('bImp').onclick = () => $('fImp').click();
  $('fImp').onchange = importBackup;
}

async function exportBackup() {
  const data = { app: 'LIMPFINC', version: VERSION, fecha: new Date().toISOString(), settings: S, fincas: await DB.all() };
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'LIMPFINC_' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function importBackup(e) {
  const file = e.target.files[0]; if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (d.app !== 'LIMPFINC' || !Array.isArray(d.fincas)) throw 0;
    confirmSheet(`Importar ${d.fincas.length} finca(s)? Las que tengan el mismo identificador se sobrescriben.`, 'Importar', async () => {
      for (const f of d.fincas) await DB.put(f);
      if (d.settings) { S = { ...DEF, ...d.settings }; await DB.kvPut('settings', S); }
      toast('Importado'); showSettings();
    });
  } catch { toast('Archivo no válido'); }
  e.target.value = '';
}

/* =========================================================
   MAPA
   ========================================================= */
let map, lyr = {}, posMarker, posCircle, followPos = false;
function initMap() {
  if (map) return;
  map = L.map('map', { zoomControl: false, attributionControl: true, maxZoom: 21 }).setView([43.22, -8.29], 15);
  const pnoa = L.tileLayer('https://www.ign.es/wmts/pnoa-ma?request=GetTile&service=WMTS&VERSION=1.0.0&Layer=OI.OrthoimageCoverage&Style=default&Format=image/jpeg&TileMatrixSet=GoogleMapsCompatible&TileMatrix={z}&TileRow={y}&TileCol={x}',
    { maxNativeZoom: 19, maxZoom: 21, attribution: 'PNOA © IGN' });
  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxNativeZoom: 19, maxZoom: 21, attribution: '© OpenStreetMap' });
  pnoa.addTo(map);
  L.control.layers({ 'Ortofoto PNOA': pnoa, 'OpenStreetMap': osm }, null, { position: 'topright' }).addTo(map);
  L.control.scale({ imperial: false, position: 'topleft' }).addTo(map);
  lyr.finca = L.layerGroup().addTo(map);
  lyr.plan = L.layerGroup().addTo(map);
  lyr.tmp = L.layerGroup().addTo(map);
  lyr.edit = L.layerGroup().addTo(map);
  map.on('dragstart', () => { followPos = false; });
  const zc = () => map.getContainer().classList.toggle('lowz', map.getZoom() < 20); map.on('zoomend', zc); zc();
}

async function openFinca(id) {
  cur = await DB.get(id); if (!cur) return showList();
  view = 'map';
  setHeader('‹ Fincas', cur.nombre, '⋯', () => { if (busy()) return toast('Termina o cancela la operación en curso'); stopGPS(); showList(); }, () => fincaForm(cur));
  $('vList').classList.add('hidden'); $('bNueva').classList.add('hidden'); $('vSet').classList.add('hidden');
  $('mapWrap').classList.remove('hidden');
  initMap(); setTimeout(() => map.invalidateSize(), 50);
  showMain();
  drawFinca(true);
  startGPS(); // posición visible
}

function drawFinca(fit) {
  lyr.finca.clearLayers(); lyr.plan.clearLayers();
  if (!cur) return;
  if (cur.plan && planVisible && !planStale(cur)) drawPlan(cur.plan, lyr.plan);
  if (cur.linde) {
    L.polygon(cur.linde.coords, { color: '#1b5e20', weight: 2.5, fillColor: '#a5d6a7', fillOpacity: .35 }).addTo(lyr.finca);
  }
  (cur.exclusiones || []).forEach(e => {
    L.polygon(e.coords, { color: '#b71c1c', weight: 2, dashArray: '6 4', fillColor: '#757575', fillOpacity: .55 })
      .bindTooltip(esc(e.nombre), { sticky: true }).addTo(lyr.finca);
  });
  if (fit) {
    const all = [...(cur.linde ? cur.linde.coords : []), ...(cur.exclusiones || []).flatMap(e => e.coords)];
    if (all.length) map.fitBounds(L.latLngBounds(all), { padding: [30, 30], maxZoom: 19 });
  }
}

function showMain() { $('tbMain').classList.remove('hidden'); $('pRec').classList.add('hidden'); $('pTool').classList.add('hidden'); }
function busy() { return !!(rec || draw || edit || review || planRev); }

/* ---------- GPS ---------- */
let watchId = null, lastPos = null, wakeLock = null;
function startGPS() {
  if (watchId !== null) return;
  if (!('geolocation' in navigator)) { toast('Geolocalización no disponible'); return; }
  watchId = navigator.geolocation.watchPosition(onPos, err => {
    toast(err.code === 1 ? 'Permiso de ubicación denegado. Ajustes › Privacidad › Localización › Safari: «Al usar la app» + Ubicación exacta' : 'GPS: ' + err.message, 5000);
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}
function stopGPS() { if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; } }
function onPos(p) {
  const c = p.coords;
  lastPos = { lat: c.latitude, lon: c.longitude, acc: c.accuracy, t: p.timestamp, spd: c.speed, hdg: c.heading };
  const ll = [c.latitude, c.longitude];
  if (!posMarker) {
    posCircle = L.circle(ll, { radius: c.accuracy, color: '#1e88e5', weight: 1, fillOpacity: .12, interactive: false }).addTo(map);
    posMarker = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="pos"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }), interactive: false, zIndexOffset: 1000 }).addTo(map);
  } else { posMarker.setLatLng(ll); posCircle.setLatLng(ll).setRadius(c.accuracy); }
  if (followPos) map.panTo(ll, { animate: false });
  if (rec) recPoint(lastPos);
}
$('bLoc').onclick = () => {
  startGPS();
  if (lastPos) { followPos = true; map.setView([lastPos.lat, lastPos.lon], Math.max(map.getZoom(), 18)); }
  else toast('Esperando posición GPS…');
};
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); }
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { /* no soportado */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && rec) { keepAwake(true); }
  if (document.visibilityState === 'hidden' && rec) rec.hiddenAt = Date.now();
  if (document.visibilityState === 'visible' && rec && rec.hiddenAt) {
    const s = Math.round((Date.now() - rec.hiddenAt) / 1000); rec.hiddenAt = 0;
    if (s > 3) toast(`La app estuvo en segundo plano ${s} s: el GPS no registró ese tramo.`, 4500);
  }
});

/* =========================================================
   MEDICIÓN POR GPS (a pie / tractor)
   ========================================================= */
let rec = null; // {target:'linde'|'excl', mode:'pie'|'tractor', pts:[], paused, line}
function lindeMenu() {
  if (busy()) return;
  sheet(`<h3>Linde de la finca</h3>
    <button class="opt" id="oPie">🚶 Medir a pie<small>Recorre el linde con el iPhone. Máxima precisión.</small></button>
    <button class="opt" id="oTrac">🚜 Medir con tractor<small>Recorre el interior junto al linde. Se corrige ${fmt(S.anchoTractor / 2 + S.holguraLinde, 2)} m hacia fuera.</small></button>
    <button class="opt" id="oDraw">✍️ Dibujar sobre el mapa<small>Toca los vértices sobre la ortofoto.</small></button>
    ${cur.linde ? '<button class="opt" id="oDel" style="color:var(--err)">🗑 Borrar linde</button>' : ''}`,
    () => {
      $('oPie').onclick = () => { closeSheet(); startRec('linde', 'pie'); };
      $('oTrac').onclick = () => { closeSheet(); tractorSetup(); };
      $('oDraw').onclick = () => { closeSheet(); startDraw('linde'); };
      if ($('oDel')) $('oDel').onclick = () => confirmSheet('¿Borrar el linde?', 'Borrar', async () => { cur.linde = null; await saveCur(); drawFinca(); }, true);
    });
}
function tractorSetup() {
  sheet(`<h3>Medir con tractor</h3>
    <div class="note" style="margin-bottom:8px">Recorre la finca por dentro, con el linde siempre al mismo lado y el tractor lo más pegado posible. La app desplaza el recorrido hacia fuera: medio ancho del tractor + holgura.</div>
    <div class="srow"><span>Ancho tractor (m)</span><input class="inp" id="tAn" inputmode="decimal" value="${String(S.anchoTractor).replace('.', ',')}" style="width:100px;text-align:right"></div>
    <div class="srow"><span>Holgura lateral tractor–linde (m)</span><input class="inp" id="tHo" inputmode="decimal" value="${String(S.holguraLinde).replace('.', ',')}" style="width:100px;text-align:right"></div>
    <div class="note" id="tOff"></div>
    <button class="btn" id="tGo" style="margin-top:12px">Empezar</button>`,
    () => {
      const upd = () => { const a = parseFloat($('tAn').value.replace(',', '.')), h = parseFloat($('tHo').value.replace(',', '.')); $('tOff').textContent = isFinite(a + h) ? `Corrección hacia fuera: ${fmt(a / 2 + h, 2)} m` : ''; };
      $('tAn').oninput = $('tHo').oninput = upd; upd();
      $('tGo').onclick = async () => {
        const a = parseFloat($('tAn').value.replace(',', '.')), h = parseFloat($('tHo').value.replace(',', '.'));
        if (!(a > 0) || !(h >= 0)) return toast('Valores no válidos');
        S.anchoTractor = a; S.holguraLinde = h; await DB.kvPut('settings', S);
        closeSheet(); startRec('linde', 'tractor');
      };
    });
}
function startRec(target, mode) {
  startGPS(); keepAwake(true);
  rec = { target, mode, pts: [], paused: false, line: L.polyline([], { color: '#ff6f00', weight: 4 }).addTo(lyr.tmp) };
  followPos = true;
  $('tbMain').classList.add('hidden'); $('pRec').classList.remove('hidden');
  $('recTitle').textContent = (target === 'linde' ? 'Linde' : 'Exclusión') + ' · ' + (mode === 'pie' ? 'a pie' : 'con tractor');
  $('bPause').textContent = 'Pausa'; $('recDot').classList.add('rec');
  $('recHint').textContent = 'Mantén la pantalla encendida. Vuelve al punto de inicio para cerrar.';
  updRecStats();
  if (lastPos) map.setView([lastPos.lat, lastPos.lon], Math.max(map.getZoom(), 18));
}
function recPoint(p) {
  updRecStats(p);
  if (rec.paused) return;
  const last = rec.pts[rec.pts.length - 1];
  if (last && p.t - last.t < 900) return; // ~1 Hz
  rec.pts.push(p);
  if (p.acc <= S.umbralPrecision) rec.line.addLatLng([p.lat, p.lon]);
  updRecStats(p);
}
function updRecStats(p) {
  p = p || lastPos;
  if (p) {
    const a = p.acc; const el = $('sAcc');
    el.textContent = '±' + fmt(a, a < 10 ? 1 : 0) + ' m';
    el.className = a <= 5 ? 'acc-ok' : a <= S.umbralPrecision ? 'acc-mid' : 'acc-bad';
  }
  $('sPts').textContent = rec.pts.length;
  const ll = rec.pts.filter(q => q.acc <= S.umbralPrecision).map(q => [q.lat, q.lon]);
  $('sLen').textContent = fmt(Geo.lenLL(ll), 0) + ' m';
  if (p && rec.pts.length > 20 && ll.length) {
    const d = Geo.lenLL([ll[0], [p.lat, p.lon]]);
    $('recHint').textContent = d < 10 ? `Cerca del inicio (${fmt(d, 0)} m). Puedes terminar.` : `Distancia al inicio: ${fmt(d, 0)} m`;
  }
}
$('bPause').onclick = () => {
  rec.paused = !rec.paused; $('bPause').textContent = rec.paused ? 'Reanudar' : 'Pausa';
  $('recDot').classList.toggle('rec', !rec.paused); $('recDot').style.background = rec.paused ? '#9e9e9e' : '';
};
$('bCancelRec').onclick = () => confirmSheet('¿Descartar la medición?', 'Descartar', endRec, true);
$('bFin').onclick = () => {
  const r = processTrack(rec.pts, rec.mode, S);
  if (r.error) return toast(r.error, 4000);
  const { target, mode, pts } = rec;
  endRec();
  startReview(target, mode, pts, r);
};
function endRec() {
  if (rec) { lyr.tmp.removeLayer(rec.line); }
  rec = null; keepAwake(false); followPos = false; showMain();
}

/* Revisión del resultado antes de guardar */
let review = null;
function startReview(target, mode, pts, r) {
  review = { target, mode, pts, r };
  lyr.tmp.clearLayers();
  L.polyline(pts.filter(p => p.acc <= S.umbralPrecision).map(p => [p.lat, p.lon]), { color: '#ff6f00', weight: 2, opacity: .8, dashArray: '3 4' }).addTo(lyr.tmp);
  L.polygon(r.coords, { color: target === 'linde' ? '#1b5e20' : '#b71c1c', weight: 3, fillColor: target === 'linde' ? '#a5d6a7' : '#757575', fillOpacity: .4 }).addTo(lyr.tmp);
  map.fitBounds(L.latLngBounds(r.coords), { padding: [30, 30], maxZoom: 19 });
  const a = Geo.areaLL(r.coords);
  let warn = [];
  if (r.gap > 15) warn.push(`⚠️ El final queda a ${fmt(r.gap, 0)} m del inicio; se ha cerrado con línea recta.`);
  if (r.selfX) warn.push('⚠️ El polígono se cruza consigo mismo. Revísalo con «Editar».');
  if (r.used < r.total) warn.push(`${r.total - r.used} punto(s) descartados por precisión.`);
  showTool(target === 'linde' ? 'Resultado: linde' : 'Resultado: exclusión',
    `Área ${fmtArea(a)} · Perímetro ${fmt(Geo.perimLL(r.coords), 0)} m · ${r.coords.length} vértices · Precisión media ±${fmt(r.accMed, 1)} m` +
    (r.offset ? ` · Corrección ${fmt(r.offset, 2)} m` : '') + (warn.length ? '<br>' + warn.join('<br>') : ''),
    [['Descartar', 'sec', () => { review = null; lyr.tmp.clearLayers(); showMain(); }],
     ['Guardar', '', async () => {
       await commitPolygon(target, r.coords, { metodo: mode, raw: compactPts(pts), offset: r.offset, accMed: r.accMed });
       review = null; lyr.tmp.clearLayers(); showMain();
     }]]);
}
const compactPts = pts => pts.map(p => [+p.lat.toFixed(7), +p.lon.toFixed(7), +p.acc.toFixed(1), p.t]);

async function commitPolygon(target, coords, meta) {
  if (target === 'linde') {
    cur.linde = { coords, ...meta, fecha: Date.now() };
  } else {
    const n = (cur.exclusiones || []).length + 1;
    cur.exclusiones = cur.exclusiones || [];
    cur.exclusiones.push({ id: uid(), nombre: 'Exclusión ' + n, coords, metodo: meta.metodo, fecha: Date.now() });
    checkExclInside(coords);
  }
  await saveCur(); drawFinca(); toast('Guardado');
}
function checkExclInside(coords) {
  if (!cur.linde) return;
  const P = Geo.projFor(cur.linde.coords), L0 = Geo.toXY(cur.linde.coords, P);
  const out = coords.filter(c => !Geo.inPoly(P.fwd(c[0], c[1]), L0)).length;
  if (out) toast(`Aviso: ${out} vértice(s) de la exclusión quedan fuera del linde.`, 4000);
}
async function saveCur() { cur.mod = Date.now(); await DB.put(cur); }

/* =========================================================
   DIBUJO MANUAL
   ========================================================= */
let draw = null;
function startDraw(target) {

function drawPanel() {

    n < 3 ? `Toca el mapa para añadir vértices (${n}/3 mínimo).` : `${n} vértices · ${fmtArea(Geo.areaLL(draw.pts))}`,
    [['Cancelar', 'sec', () => endDraw()], ['Deshacer', 'sec', () => { draw.pts.pop(); drawUpd(); }, !n],
     ['Terminar', '', async () => {
       const P = Geo.projFor(draw.pts); let xy = Geo.ccw(Geo.toXY(draw.pts, P));
       if (Geo.selfIntersects(xy)) toast('Aviso: el polígono se cruza consigo mismo', 3500);

}

let edit = null;

  if (busy()) return;
  const items = [];

  if (!items.length) return toast('No hay nada que editar todavía');
  sheet(`<h3>¿Qué quieres editar?</h3>` + items.map((it, i) => `<button class="opt" data-i="${i}">${it[2]}<small>${it[3]}</small></button>`).join(''),
    sh => sh.querySelectorAll('.opt').forEach(b => b.onclick = () => { closeSheet(); const it = items[+b.dataset.i]; startEdit(it[0], it[1]); }));
}
function startEdit(kind, id) {
  const src = kind === 'linde' ? cur.linde.coords : cur.exclusiones.find(e => e.id === id).coords;
  edit = { kind, id, pts: src.map(p => p.slice()), delMode: false };
  lyr.finca.clearLayers(); drawFincaExcept(kind, id);
  edit.poly = L.polygon(edit.pts, { color: kind === 'linde' ? '#1b5e20' : '#b71c1c', weight: 3, fillColor: kind === 'linde' ? '#a5d6a7' : '#757575', fillOpacity: .35 }).addTo(lyr.edit);
  editMarkers(); editPanel();
}
function drawFincaExcept(kind, id) {
  if (cur.linde && kind !== 'linde') L.polygon(cur.linde.coords, { color: '#1b5e20', weight: 2, fillColor: '#a5d6a7', fillOpacity: .2, interactive: false }).addTo(lyr.finca);
  (cur.exclusiones || []).forEach(e => { if (!(kind === 'excl' && e.id === id)) L.polygon(e.coords, { color: '#b71c1c', weight: 1.5, dashArray: '6 4', fillColor: '#757575', fillOpacity: .4, interactive: false }).addTo(lyr.finca); });
}
function editMarkers() {
  lyr.edit.eachLayer(l => { if (l !== edit.poly) lyr.edit.removeLayer(l); });
  const ex = edit.kind === 'excl';
  edit.pts.forEach((p, i) => {
    const m = L.marker(p, { icon: vIcon(ex, edit.delMode), draggable: !edit.delMode, zIndexOffset: 500 }).addTo(lyr.edit);
    m.on('drag', e => { edit.pts[i] = [e.latlng.lat, e.latlng.lng]; edit.poly.setLatLngs(edit.pts); });
    m.on('dragend', () => { editMarkers(); editPanel(); });
    m.on('click', () => {
      if (!edit.delMode) return;
      if (edit.pts.length <= 3) return toast('Mínimo 3 vértices');
      edit.pts.splice(i, 1); edit.poly.setLatLngs(edit.pts); editMarkers(); editPanel();
    });
  });
  if (!edit.delMode) edit.pts.forEach((p, i) => {
    const q = edit.pts[(i + 1) % edit.pts.length];
    const m = L.marker([(p[0] + q[0]) / 2, (p[1] + q[1]) / 2], { icon: midIcon, zIndexOffset: 400 }).addTo(lyr.edit);
    m.on('click', () => { edit.pts.splice(i + 1, 0, [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]); edit.poly.setLatLngs(edit.pts); editMarkers(); editPanel(); });
  });
}
function editPanel() {
  const name = edit.kind === 'linde' ? 'linde' : cur.exclusiones.find(e => e.id === edit.id).nombre;
  const btns = [['Cancelar', 'sec', () => endEdit(false)],
    [edit.delMode ? 'Mover' : 'Borrar vért.', edit.delMode ? 'warn' : 'sec', () => { edit.delMode = !edit.delMode; editMarkers(); editPanel(); }]];
  if (edit.kind === 'excl') btns.push(['Eliminar', 'err', () => confirmSheet(`¿Eliminar «${esc(name)}»?`, 'Eliminar', async () => {
    cur.exclusiones = cur.exclusiones.filter(e => e.id !== edit.id); await saveCur(); endEdit(false);
  }, true)]);
  btns.push(['Guardar', '', () => endEdit(true)]);
  showTool('Editar ' + name,
    (edit.delMode ? 'Toca un vértice para borrarlo.' : 'Arrastra los vértices. Toca ○ para insertar uno nuevo.') + ` · ${edit.pts.length} vértices · ${fmtArea(Geo.areaLL(edit.pts))}`,
    btns);
}
async function endEdit(save) {
  if (save) {
    const P = Geo.projFor(edit.pts); const xy = Geo.toXY(edit.pts, P);
    if (Geo.selfIntersects(xy)) toast('Aviso: el polígono se cruza consigo mismo', 3500);
    const coords = Geo.toLL(Geo.ccw(xy), P);
    if (edit.kind === 'linde') { cur.linde.coords = coords; cur.linde.editado = Date.now(); }
    else { const e = cur.exclusiones.find(e => e.id === edit.id); e.coords = coords; checkExclInside(coords); }
    await saveCur(); toast('Guardado');
  }
  lyr.edit.clearLayers(); edit = null; drawFinca(); showMain();
}

/* =========================================================
   PLANIFICADOR (F2) — finca abierta
   Vueltas perimetrales + pasadas paralelas + giros U / K / Ω
   ========================================================= */
const Planner = (() => {
  const SC = 1000; // Clipper trabaja en enteros (mm)
  const CL = () => window.ClipperLib;
  const toC = xy => xy.map(p => ({ X: Math.round(p[0] * SC), Y: Math.round(p[1] * SC) }));
  const frC = pa => pa.map(q => [q.X / SC, q.Y / SC]);
  const areaP = p => Math.abs(CL().Clipper.Area(p)) / SC / SC;
  const areaC = ps => Math.abs(ps.reduce((s, p) => s + CL().Clipper.Area(p), 0)) / SC / SC;
  function off(paths, d, round, miter = 3) {
    const C = CL(); const co = new C.ClipperOffset(miter, 0.02 * SC);
    co.AddPaths(paths, round ? C.JoinType.jtRound : C.JoinType.jtMiter, C.EndType.etClosedPolygon);
    const s = new C.Paths(); co.Execute(s, d * SC); return s;
  }
  function boolOp(op, a, b) {
    const C = CL(); const c = new C.Clipper();
    c.AddPaths(a, C.PolyType.ptSubject, true); if (b && b.length) c.AddPaths(b, C.PolyType.ptClip, true);
    const s = new C.Paths();
    c.Execute(op === 'diff' ? C.ClipType.ctDifference : op === 'int' ? C.ClipType.ctIntersection : C.ClipType.ctUnion, s, C.PolyFillType.pftNonZero, C.PolyFillType.pftNonZero);
    return s;
  }
  function clipLines(lines, region) {
    const C = CL(); const c = new C.Clipper();
    lines.forEach(l => c.AddPath(toC(l), C.PolyType.ptSubject, false));
    c.AddPaths(region, C.PolyType.ptClip, true);
    const tree = new C.PolyTree();
    c.Execute(C.ClipType.ctIntersection, tree, C.PolyFillType.pftNonZero, C.PolyFillType.pftNonZero);
    return C.Clipper.OpenPathsFromPolyTree(tree).map(frC);
  }
  /* ---- anillos (polilíneas cerradas) ---- */
  function mkRing(xy) { const n = xy.length, cum = [0]; for (let i = 0; i < n; i++) cum.push(cum[i] + Geo.dist(xy[i], xy[(i + 1) % n])); return { xy, cum, L: cum[n] }; }
  function projRing(r, p) {
    let best = { d: Infinity }; const n = r.xy.length;
    for (let i = 0; i < n; i++) {
      const a = r.xy[i], b = r.xy[(i + 1) % n], ab = [b[0] - a[0], b[1] - a[1]], L2 = ab[0] * ab[0] + ab[1] * ab[1] || 1e-12;
      let t = ((p[0] - a[0]) * ab[0] + (p[1] - a[1]) * ab[1]) / L2; t = Math.max(0, Math.min(1, t));
      const q = [a[0] + ab[0] * t, a[1] + ab[1] * t], d = Geo.dist(p, q);
      if (d < best.d) best = { d, q, i, s: r.cum[i] + t * Math.sqrt(L2) };
    }
    return best;
  }
  function ringWalk(r, A, B, wantPath) {
    let d1 = B.s - A.s; if (d1 < 0) d1 += r.L; const d2 = r.L - d1; const fwd = d1 <= d2, len = Math.min(d1, d2);
    if (!wantPath) return { len };
    const n = r.xy.length, pts = [A.q];
    if (fwd) { for (let c = 0, k = (A.i + 1) % n; c < n; c++, k = (k + 1) % n) { const arc = (r.cum[k] - A.s + r.L) % r.L; if (arc >= d1 || arc === 0 && c > 0) break; pts.push(r.xy[k]); } }
    else { for (let c = 0, k = A.i; c < n; c++, k = (k - 1 + n) % n) { const arc = (A.s - r.cum[k] + r.L) % r.L; if (arc >= d2) break; pts.push(r.xy[k]); } }
    pts.push(B.q); return { len, pts };
  }
  const plen = xy => { let s = 0; for (let i = 1; i < xy.length; i++) s += Geo.dist(xy[i - 1], xy[i]); return s; };
  function corners(xy, closed) {
    let c = 0; const n = xy.length;
    for (let i = closed ? 0 : 1; i < (closed ? n : n - 1); i++) {
      const a = xy[(i - 1 + n) % n], b = xy[i], d = xy[(i + 1) % n];
      const h1 = Math.atan2(b[1] - a[1], b[0] - a[0]), h2 = Math.atan2(d[1] - b[1], d[0] - b[0]);
      let dh = Math.abs(h2 - h1); if (dh > Math.PI) dh = 2 * Math.PI - dh;
      if (dh > Math.PI / 4) c++;
    }
    return c;
  }
  function rotateTo(xy, p) { let bi = 0, bd = Infinity; xy.forEach((q, i) => { const d = Geo.dist(p, q); if (d < bd) { bd = d; bi = i; } }); const r = xy.slice(bi).concat(xy.slice(0, bi)); return r.concat([r[0]]); }

  /* ---- cabecera necesaria ---- */
  function headlandNeed(S) {
    const w = S.aperoAncho, we = w - Math.min(S.solape, w / 2), R = S.radioGiro;
    const fr = Math.max(0.5, S.longTractorApero - S.offsetApero - 0.5);      // voladizo delantero desde eje trasero
    const ro = Math.hypot(R + S.anchoTractor / 2, fr);                         // radio exterior esquina delantera
    let need = S.offsetApero + ro + 0.3;
    if (!S.marchaAtras) { const ad = Math.min(we, 2 * R); const h = Math.sqrt(Math.max(0, 4 * R * R - (ad / 2 + R) ** 2)); need = S.offsetApero + h + ro + 0.3; }
    return need;
  }

  /* ---- plan principal ---- */
  function plan(f, S, opt = {}) {
    const T0 = performance.now();
    const P = Geo.projFor(f.linde.coords);
    const fieldXY = Geo.ccw(Geo.toXY(f.linde.coords, P));
    const field = [toC(fieldXY)];
    const obs = (f.exclusiones || []).map(e => toC(Geo.ccw(Geo.toXY(e.coords, P))));
    const w = S.aperoAncho, s = Math.min(S.solape, w / 2), we = w - s, R = S.radioGiro;
    const vw = S.velocidad / 3.6, vg = S.velocidadGiro / 3.6, vt = S.velocidadTraslado / 3.6;
    const need = headlandNeed(S);
    const nHauto = 1 + Math.ceil(Math.max(0, need - w) / we);
    const nH = opt.nH > 0 ? Math.round(opt.nH) : nHauto;
    const warn = [];

    // anillos de cabecera
    const hl = [];
    for (let k = 0; k < nH; k++) {
      const ps = off(field, -(w / 2 + k * we)).filter(p => areaP(p) > 4);
      if (!ps.length) break;
      hl.push(ps.map(p => Geo.ccw(frC(p))));
    }
    if (!hl.length) return { error: 'La finca es demasiado pequeña para el apero.' };
    if (hl.length < nH) warn.push('La finca se cubre solo con vueltas perimetrales.');
    const inner = off(field, -(w + (hl.length - 1) * we));
    const marg = S.margenObstaculo;
    const obsInf = obs.length ? off(obs, w / 2 + marg, true) : [];
    const region = obsInf.length ? boolOp('diff', inner, obsInf) : inner;
    const obsRings = obs.map(o => { const ps = off([o], w / 2 + marg, true); if (!ps.length) return null; const big = ps.reduce((a, b) => areaP(a) >= areaP(b) ? a : b); return mkRing(Geo.ccw(frC(big))); });
    if (obs.length) {
      const hlZone = boolOp('diff', field, inner);
      if (areaC(boolOp('int', obsInf, hlZone)) > 0.5) warn.push('Hay exclusiones dentro de la zona de cabecera: revisa ahí los giros.');
    }
    // anillo de traslado (centro de la cabecera)
    const trRingXY = hl[Math.floor((hl.length - 1) / 2)].reduce((a, b) => Geo.area(a) >= Geo.area(b) ? a : b);
    const trRing = mkRing(trRingXY);

    /* pasadas para un azimut */
    const regionPts = region.flatMap(frC);
    function swaths(az) {
      const u = [Math.sin(az * D2R), Math.cos(az * D2R)], n = [u[1], -u[0]];
      if (!regionPts.length) return { segs: [], u, n, lines: 0, az };
      let tmin = Infinity, tmax = -Infinity, smin = Infinity, smax = -Infinity;
      for (const p of regionPts) { const t = p[0] * n[0] + p[1] * n[1], q = p[0] * u[0] + p[1] * u[1]; if (t < tmin) tmin = t; if (t > tmax) tmax = t; if (q < smin) smin = q; if (q > smax) smax = q; }
      const ts = [], t1 = tmin + w / 2 - s, tN = tmax - w / 2 + s;
      if (tN <= t1) ts.push((tmin + tmax) / 2);
      else { for (let t = t1; t < tN - 1e-6; t += we) ts.push(t); if (tN - ts[ts.length - 1] > 0.25 * we) ts.push(tN); }
      const lines = ts.map(t => [[u[0] * (smin - 5) + n[0] * t, u[1] * (smin - 5) + n[1] * t], [u[0] * (smax + 5) + n[0] * t, u[1] * (smax + 5) + n[1] * t]]);
      const segs = [];
      for (const pl of clipLines(lines, region)) {
        if (pl.length < 2) continue;
        let a = pl[0], b = pl[pl.length - 1];
        if ((b[0] - a[0]) * u[0] + (b[1] - a[1]) * u[1] < 0) [a, b] = [b, a];
        const len = Geo.dist(a, b); if (len < 1) continue;
        segs.push({ a, b, len });
      }
      return { segs, u, n, lines: ts.length, az };
    }
    const tU = Math.PI * R / vg;
    const quick = sw => sw.segs.reduce((q, g) => q + g.len, 0) / vw + sw.segs.length * tU + Math.max(0, sw.segs.length - sw.lines) * 45;

    // candidatos de dirección
    let cands;
    if (opt.az != null && isFinite(opt.az)) cands = [((opt.az % 180) + 180) % 180];
    else {
      const sc = []; for (let a = 0; a < 180; a++) sc.push([a, quick(swaths(a))]);
      sc.sort((x, y) => x[1] - y[1]); cands = [];
      const far = a => cands.every(c => Math.min(Math.abs(c - a), 180 - Math.abs(c - a)) >= 3);
      // direcciones de los 3 lados más largos del linde (pasadas paralelas a lindes)
      const edges = fieldXY.map((p, i) => { const q = fieldXY[(i + 1) % fieldXY.length]; return [Geo.dist(p, q), ((Math.round(Math.atan2(q[0] - p[0], q[1] - p[1]) / D2R) % 180) + 180) % 180]; }).sort((x, y) => y[0] - x[0]);
      for (const [, a] of edges.slice(0, 3)) if (far(a)) cands.push(a);
      for (const [a] of sc) { if (far(a) && cands.every(c => Math.min(Math.abs(c - a), 180 - Math.abs(c - a)) >= 8)) cands.push(a); if (cands.length >= 6) break; }
    }

    // clasificación de extremos
    function kindAt(p) {
      for (let i = 0; i < obsRings.length; i++) { const r = obsRings[i]; if (r && projRing(r, p).d < 0.25) return { kind: 'obs', obs: i }; }
      return { kind: 'hl' };
    }
    const projCache = new Map();
    const pjT = p => { const k = p[0].toFixed(3) + ',' + p[1].toFixed(3); let v = projCache.get(k); if (!v) { v = projRing(trRing, p); projCache.set(k, v); } return v; };

    function trans(E, N) {
      const h = E.h, nl = [-h[1], h[0]], d = [N.p[0] - E.p[0], N.p[1] - E.p[1]];
      const du = d[0] * h[0] + d[1] * h[1], dv = d[0] * nl[0] + d[1] * nl[1], ad = Math.abs(dv);
      const dot = h[0] * N.h[0] + h[1] * N.h[1];
      if (E.kind === 'hl' && N.kind === 'hl' && dot < -0.99 && Math.abs(du) < 25 && ad > 0.05) {
        if (ad >= 2 * R - 1e-6) { const L = Math.PI * R + (ad - 2 * R) + Math.abs(du); return { type: 'U', L, t: L / vg }; }
        if (S.marchaAtras) { const L = Math.PI * R + (2 * R - ad) + Math.abs(du); return { type: 'K', L, t: L / vg + 2 * S.tCambioSentido }; }
        const th = Math.atan2(Math.sqrt(Math.max(0, 4 * R * R - (ad / 2 + R) ** 2)), ad / 2 + R);
        const L = R * (Math.PI + 4 * th) + Math.abs(du); return { type: 'O', L, t: L / vg };
      }
      if (E.kind === 'obs' && N.kind === 'obs' && E.obs === N.obs && dot > 0.99 && ad < 0.05 && du > 0) {
        const r = obsRings[E.obs]; const L = ringWalk(r, projRing(r, E.p), projRing(r, N.p)).len;
        return { type: 'rodeo', L, t: L / vg };
      }
      let L;
      if (E.kind === 'hl' && N.kind === 'hl') { const A = pjT(E.p), B = pjT(N.p); L = A.d + ringWalk(trRing, A, B).len + B.d; }
      else L = Geo.dist(E.p, N.p) * 1.2;
      return { type: 'tras', L, t: L / vt + S.tManiobra };
    }

    function solve(sw, startP) {
      const segs = sw.segs, N = segs.length; if (!N) return { seq: [], cost: 0, ex: [], en: [] };
      const u = sw.u, mu = [-u[0], -u[1]], ex = [], en = [];
      segs.forEach((g, i) => {
        const ka = kindAt(g.a), kb = kindAt(g.b);
        ex[2 * i] = { p: g.b, h: u, ...kb }; ex[2 * i + 1] = { p: g.a, h: mu, ...ka };
        en[2 * i] = { p: g.a, h: u, ...ka }; en[2 * i + 1] = { p: g.b, h: mu, ...kb };
      });
      const M = 2 * N, C = new Float64Array(M * M), C0 = new Float64Array(M);
      for (let i = 0; i < M; i++) for (let j = 0; j < M; j++) C[i * M + j] = (i >> 1) === (j >> 1) ? 1e9 : trans(ex[i], en[j]).t;
      for (let j = 0; j < M; j++) C0[j] = Geo.dist(startP, en[j].p) / vt;
      const cost = q => { let c = C0[q[0]]; for (let k = 1; k < q.length; k++) c += C[q[k - 1] * M + q[k]]; return c; };
      function greedy() {
        const used = new Uint8Array(N), q = []; let cur = -1;
        for (let k = 0; k < N; k++) { let best = -1, bc = Infinity; for (let j = 0; j < M; j++) { if (used[j >> 1]) continue; const c = cur < 0 ? C0[j] : C[cur * M + j]; if (c < bc) { bc = c; best = j; } } used[best >> 1] = 1; q.push(best); cur = best; }
        return q;
      }
      function bous() {
        const idx = segs.map((g, i) => i).sort((a, b) => { const ta = (segs[a].a[0] * sw.n[0] + segs[a].a[1] * sw.n[1]), tb = (segs[b].a[0] * sw.n[0] + segs[b].a[1] * sw.n[1]); return ta - tb || (segs[a].a[0] * u[0] + segs[a].a[1] * u[1]) - (segs[b].a[0] * u[0] + segs[b].a[1] * u[1]); });
        return idx.map((i, k) => 2 * i + (k & 1));
      }
      function twoOpt(q, ms) {
        const n = q.length, tEnd = performance.now() + ms; let imp = true;
        while (imp && performance.now() < tEnd) {
          imp = false;
          for (let i = -1; i < n - 1; i++) for (let j = i + 1; j < n; j++) {
            const a = i < 0 ? C0[q[i + 1]] : C[q[i] * M + q[i + 1]], b = j < n - 1 ? C[q[j] * M + q[j + 1]] : 0;
            const fj = q[j] ^ 1, fi = q[i + 1] ^ 1;
            const a2 = i < 0 ? C0[fj] : C[q[i] * M + fj], b2 = j < n - 1 ? C[fi * M + q[j + 1]] : 0;
            if (a2 + b2 < a + b - 1e-6) {
              let x = i + 1, y = j; while (x < y) { const t = q[x]; q[x] = q[y] ^ 1; q[y] = t ^ 1; x++; y--; } if (x === y) q[x] ^= 1;
              imp = true;
            }
          }
        }
        return q;
      }
      const budget = Math.max(150, 1200 / cands.length);
      const sols = [twoOpt(greedy(), budget / 2), twoOpt(bous(), budget / 2)].map(q => ({ q, c: cost(q) })).sort((a, b) => a.c - b.c);
      return { seq: sols[0].q, cost: sols[0].c, ex, en };
    }

    /* fase 1: vueltas perimetrales (espiral hacia dentro) */
    const lindeXY = fieldXY;
    let startP = opt.start ? P.fwd(opt.start[0], opt.start[1]) : lindeXY[0];
    const pre = []; let cur = startP, nCorners = 0;
    hl.forEach((pieces, k) => {
      const left = pieces.slice();
      while (left.length) {
        let bi = 0, bd = Infinity; left.forEach((r, i) => r.forEach(q => { const d = Geo.dist(cur, q); if (d < bd) { bd = d; bi = i; } }));
        const ring = left.splice(bi, 1)[0], loop = rotateTo(ring, cur);
        pre.push({ type: k === 0 && pre.length === 0 ? 'tras' : (bd > 2.5 * we ? 'tras' : 'giro'), xy: [cur, loop[0]] });
        pre.push({ type: 'trabajo', xy: loop, ring: true });
        nCorners += corners(ring, true); cur = loop[0];
      }
    });
    /* fase 2: vueltas alrededor de exclusiones */
    const oleft = obsRings.filter(Boolean).map(r => r.xy);
    while (oleft.length) {
      let bi = 0, bd = Infinity; oleft.forEach((r, i) => r.forEach(q => { const d = Geo.dist(cur, q); if (d < bd) { bd = d; bi = i; } }));
      const loop = rotateTo(oleft.splice(bi, 1)[0], cur);
      pre.push({ type: 'tras', xy: [cur, loop[0]] }); pre.push({ type: 'trabajo', xy: loop, ring: true }); cur = loop[0];
    }
    /* fase 3: pasadas, se evalúan los candidatos */
    let best = null;
    for (const az of cands) {
      const sw = swaths(az), so = solve(sw, cur);
      if (!best || so.cost < best.so.cost) best = { sw, so, az };
    }
    const { sw, so } = best, parts = pre.slice();
    const cnt = { U: 0, K: 0, O: 0, rodeo: 0, tras: 0 };

    // geometría de transiciones
    function turnGeom(E, N, type) {
      const h = E.h, nl = [-h[1], h[0]], d = [N.p[0] - E.p[0], N.p[1] - E.p[1]];
      const du = d[0] * h[0] + d[1] * h[1], dv = d[0] * nl[0] + d[1] * nl[1];
      const W = (x, y) => [E.p[0] + x * h[0] + y * nl[0], E.p[1] + x * h[1] + y * nl[1]];
      const sg = dv >= 0 ? 1 : -1, u0 = Math.max(0, du);
      const arc = (cx, cy, a0, a1, dir) => {
        let sw_ = a1 - a0;
        if (dir > 0) { while (sw_ <= 1e-9) sw_ += 2 * Math.PI; while (sw_ > 2 * Math.PI) sw_ -= 2 * Math.PI; }
        else { while (sw_ >= -1e-9) sw_ -= 2 * Math.PI; while (sw_ < -2 * Math.PI) sw_ += 2 * Math.PI; }
        const ns = Math.max(4, Math.ceil(Math.abs(sw_) * R / 0.5)), o = [];
        for (let i = 0; i <= ns; i++) { const a = a0 + sw_ * i / ns; o.push(W(cx + R * Math.cos(a), cy + R * Math.sin(a))); }
        return o;
      };
      const ang = (cx, cy, x, y) => Math.atan2(y - cy, x - cx);
      const preS = du > 0 ? [W(0, 0)] : [], postS = du < 0 ? [W(du, dv)] : [];
      if (type === 'U' || type === 'K') {
        const a1 = arc(u0, sg * R, -sg * Math.PI / 2, 0, sg), a2 = arc(u0, dv - sg * R, 0, sg * Math.PI / 2, sg);
        if (type === 'U') return [{ type: 'giro', xy: [...preS, ...a1, ...a2, ...postS] }];
        return [{ type: 'giro', xy: [...preS, ...a1] }, { type: 'reversa', xy: [a1[a1.length - 1], a2[0]] }, { type: 'giro', xy: [...a2, ...postS] }];
      }
      // Ω
      const ad = Math.abs(dv), hh = Math.sqrt(Math.max(0, 4 * R * R - (ad / 2 + R) ** 2));
      const c1 = [u0, -sg * R], c3 = [u0, dv + sg * R], c2 = [u0 + hh, dv / 2];
      const t1 = [(c1[0] + c2[0]) / 2, (c1[1] + c2[1]) / 2], t2 = [(c2[0] + c3[0]) / 2, (c2[1] + c3[1]) / 2];
      const A1 = arc(c1[0], c1[1], ang(c1[0], c1[1], u0, 0), ang(c1[0], c1[1], t1[0], t1[1]), -sg);
      const A2 = arc(c2[0], c2[1], ang(c2[0], c2[1], t1[0], t1[1]), ang(c2[0], c2[1], t2[0], t2[1]), sg);
      const A3 = arc(c3[0], c3[1], ang(c3[0], c3[1], t2[0], t2[1]), ang(c3[0], c3[1], u0, dv), -sg);
      return [{ type: 'giro', xy: [...preS, ...A1, ...A2, ...A3, ...postS] }];
    }
    const arrows = [];
    so.seq.forEach((v, k) => {
      const g = sw.segs[v >> 1], dir = v & 1, a = dir ? g.b : g.a, b = dir ? g.a : g.b;
      if (k === 0) parts.push({ type: 'tras', xy: [cur, a] });
      else {
        const E = so.ex[so.seq[k - 1]], N = so.en[v], tr = trans(E, N);
        if (tr.type === 'U' || tr.type === 'K' || tr.type === 'O') { cnt[tr.type]++; parts.push(...turnGeom(E, N, tr.type)); }
        else if (tr.type === 'rodeo') { cnt.rodeo++; const r = obsRings[E.obs]; parts.push({ type: 'giro', xy: [E.p, ...ringWalk(r, projRing(r, E.p), projRing(r, N.p), true).pts, N.p] }); }
        else {
          cnt.tras++;
          if (E.kind === 'hl' && N.kind === 'hl') { const A = pjT(E.p), B = pjT(N.p); parts.push({ type: 'tras', xy: [E.p, ...ringWalk(trRing, A, B, true).pts, N.p] }); }
          else parts.push({ type: 'tras', xy: [E.p, N.p] });
        }
      }
      parts.push({ type: 'trabajo', xy: [a, b], swath: true });
      arrows.push({ xy: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], az: (Math.atan2(b[0] - a[0], b[1] - a[1]) / D2R + 360) % 360 });
    });

    /* estadísticas */
    const L = { trabajo: 0, giro: 0, reversa: 0, tras: 0 };
    parts.forEach(p => { p.len = plen(p.xy); L[p.type] += p.len; });
    const tTrab = L.trabajo / vw, tGiro = (L.giro + L.reversa) / vg + cnt.K * 2 * S.tCambioSentido, tTras = L.tras / vt + cnt.tras * S.tManiobra, tEsq = nCorners * S.tEsquina;
    const tTot = tTrab + tGiro + tTras + tEsq; // s

    /* cobertura teórica */
    const C = CL(), co = new C.ClipperOffset(2, 0.05 * SC);
    parts.filter(p => p.type === 'trabajo').forEach(p => { const xy = p.ring ? p.xy.slice(0, -1) : p.xy; co.AddPath(toC(xy), C.JoinType.jtRound, p.ring ? C.EndType.etClosedLine : C.EndType.etOpenButt); });
    const covered = new C.Paths(); co.Execute(covered, w / 2 * SC);
    const work = obs.length ? boolOp('diff', field, obs) : field;
    const aWork = areaC(work), aCov = areaC(boolOp('int', work, covered));
    const missed = boolOp('diff', work, covered).filter(p => areaP(p) > 0.5 && C.Clipper.Orientation(p));
    const aMiss = Math.max(0, aWork - aCov);

    const toLL = xy => Geo.toLL(xy, P).map(q => [+q[0].toFixed(7), +q[1].toFixed(7)]);
    return {
      fecha: Date.now(), geomKey: geomKey(f), az: best.az, nH: hl.length, nHauto, need, ms: Math.round(performance.now() - T0), warn,
      params: { w, s, R, marchaAtras: !!S.marchaAtras, v: S.velocidad, consumo: S.consumo },
      parts: parts.filter(p => p.len > 0.05).map(p => ({ type: p.type, ll: toLL(p.xy), swath: !!p.swath })),
      arrows: arrows.map(a => ({ ll: toLL([a.xy])[0], az: Math.round(a.az) })),
      missed: missed.map(p => toLL(frC(p))),
      stats: {
        nPasadas: sw.segs.length, nVueltas: hl.length, nObs: obsRings.filter(Boolean).length,
        giros: cnt, esquinas: nCorners,
        L: { trabajo: L.trabajo, giro: L.giro, reversa: L.reversa, traslado: L.tras, total: L.trabajo + L.giro + L.reversa + L.tras },
        t: { trabajo: tTrab, giros: tGiro, traslado: tTras, esquinas: tEsq, total: tTot },
        litros: tTot / 3600 * S.consumo,
        area: { objetivo: aWork, cubierta: aCov, noAlcanzada: aMiss, cobertura: aWork ? aCov / aWork : 0 },
        haH: aWork / 10000 / (tTot / 3600)
      }
    };
  }
  return { plan, headlandNeed };
})();

function geomKey(f) {
  const s = JSON.stringify([f.linde && f.linde.coords, (f.exclusiones || []).map(e => e.coords)]);
  let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36) + s.length.toString(36);
}

   PLAN — interfaz
   ========================================================= */
let planRev = null, showMissed = false, planVisible = true;
const PLAN_STYLE = {
  trabajo: { color: '#1565c0', weight: 3.5, opacity: .95 },
  giro: { color: '#1e88e5', weight: 2, opacity: .85 },
  reversa: { color: '#1e88e5', weight: 2, opacity: .9, dashArray: '4 4' },
  tras: { color: '#64b5f6', weight: 2, opacity: .9, dashArray: '1 6' }
};
function drawPlan(pl, layer) {
  layer.clearLayers();
  if (!pl) return;
  if (showMissed) pl.missed.forEach(m => L.polygon(m, { color: '#ef6c00', weight: 1, fillColor: '#ff9800', fillOpacity: .55, interactive: false }).addTo(layer));
  pl.parts.forEach(p => L.polyline(p.ll, { ...PLAN_STYLE[p.type], interactive: false }).addTo(layer));
  pl.arrows.forEach(a => L.marker(a.ll, { interactive: false, icon: L.divIcon({ className: '', html: `<div class="arr" style="transform:rotate(${a.az}deg)"></div>`, iconSize: [12, 12], iconAnchor: [6, 6] }) }).addTo(layer));
  const all = pl.parts; if (!all.length) return;
  const st = all[0].ll[0], en = all[all.length - 1].ll[all[all.length - 1].ll.length - 1];
  L.marker(st, { interactive: false, icon: L.divIcon({ className: '', html: '<div class="pin" style="background:#2e7d32">I</div>', iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(layer);
  L.marker(en, { interactive: false, icon: L.divIcon({ className: '', html: '<div class="pin" style="background:#c62828">F</div>', iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(layer);
}
const planStale = f => f.plan && f.plan.geomKey !== geomKey(f);

  if (!cur.plan) return planOptions();
  const st = cur.plan.stats;
  sheet(`<h3>Plan de trabajo</h3>

    <div class="card">
      <div class="kv"><span>Tiempo estimado</span><span>${fmtH(st.t.total / 3600)}</span></div>
      <div class="kv"><span>Combustible</span><span>${fmt(st.litros, 1)} L</span></div>

function planOptions() {
  const o = cur.planOpt || { dirMode: 'auto', az: 0, nHMode: 'auto', nH: 0, start: 'gps' };
  const need = Planner.headlandNeed(S), we = S.aperoAncho - Math.min(S.solape, S.aperoAncho / 2);
  const nHauto = 1 + Math.ceil(Math.max(0, need - S.aperoAncho) / we);
  sheet(`<h3>Calcular plan</h3>
    <label class="f">Dirección de las pasadas</label>
    <div class="seg" id="oDir"><button data-v="auto">Automática (óptima)</button><button data-v="man">Manual</button></div>
    <div class="srow ${o.dirMode === 'man' ? '' : 'hidden'}" id="oAzR"><span>Azimut (° desde el norte, 0–179)</span><input class="inp" id="oAz" inputmode="decimal" value="${o.az}" style="width:90px;text-align:right"></div>
    <label class="f">Vueltas perimetrales (cabecera)</label>
    <div class="seg" id="oNH"><button data-v="auto">Auto (${nHauto})</button><button data-v="man">Manual</button></div>
    <div class="srow ${o.nHMode === 'man' ? '' : 'hidden'}" id="oNHR"><span>Número de vueltas</span><input class="inp" id="oNHv" inputmode="numeric" value="${o.nH || nHauto}" style="width:90px;text-align:right"></div>
    <div class="note">Cabecera necesaria para girar: ${fmt(need, 1)} m → ${nHauto} vueltas de ${fmt(we, 2)} m.</div>
    <label class="f">Punto de inicio</label>
    <div class="seg" id="oSt"><button data-v="gps">Mi posición</button><button data-v="map">Elegir en mapa</button><button data-v="v0">1.er vértice</button></div>
    <div class="card" style="margin-top:12px;font-size:13px;color:var(--sub)">
      Apero ${fmt(S.aperoAncho, 2)} m · solape ${fmt(S.solape, 2)} m · R giro ${fmt(S.radioGiro, 1)} m · marcha atrás ${S.marchaAtras ? 'sí' : 'no'} ·
      ${fmt(S.velocidad, 1)} km/h trabajo · ${fmt(S.velocidadGiro, 1)} km/h giro · ${fmt(S.consumo, 1)} L/h. <i>Se cambian en Ajustes.</i></div>
    <button class="btn" id="oGo">Calcular</button>`,
    () => {
      const segs = { oDir: 'dirMode', oNH: 'nHMode', oSt: 'start' };
      for (const [id, key] of Object.entries(segs)) {
        const el = $(id); const paint = () => el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === o[key]));
        el.querySelectorAll('button').forEach(b => b.onclick = () => { o[key] = b.dataset.v; paint(); $('oAzR').classList.toggle('hidden', o.dirMode !== 'man'); $('oNHR').classList.toggle('hidden', o.nHMode !== 'man'); });
        paint();
      }
      $('oGo').onclick = async () => {
        o.az = parseFloat($('oAz').value.replace(',', '.')) || 0; o.nH = parseInt($('oNHv').value) || 0;
        cur.planOpt = o; await saveCur(); closeSheet();
        if (o.start === 'map') { pickStart(o); return; }
        let st = null;
        if (o.start === 'gps') {
          if (lastPos && Geo.lenLL([[lastPos.lat, lastPos.lon], cur.linde.coords[0]]) < 2000) st = [lastPos.lat, lastPos.lon];
          else toast('Sin posición GPS cercana: se usa el primer vértice', 3000);
        }
        runPlan(o, st);
      };
    });
}
function pickStart(o) {
  planRev = { picking: true };
  showTool('Punto de inicio', 'Toca en el mapa el punto por donde entra el tractor a la finca.', [['Cancelar', 'sec', () => { map.off('click', onPick); planRev = null; showMain(); }]]);
  function onPick(e) { map.off('click', onPick); planRev = null; runPlan(o, [e.latlng.lat, e.latlng.lng]); }
  map.on('click', onPick);
}
function runPlan(o, start) {
  const ov = document.createElement('div'); ov.className = 'busyOv'; ov.innerHTML = '<div>Calculando plan…<br><small>Optimizando dirección y orden de pasadas</small></div>'; document.body.appendChild(ov);
  setTimeout(() => {
    let pl;
    try { pl = Planner.plan(cur, S, { az: o.dirMode === 'man' ? o.az : null, nH: o.nHMode === 'man' ? o.nH : 0, start }); }
    catch (e) { console.error(e); pl = { error: 'Error en el cálculo: ' + e.message }; }
    ov.remove();
    if (pl.error) { toast(pl.error, 4000); showMain(); return; }
    planReview(pl);
  }, 40);
}
function planReview(pl) {
  planRev = { pl };
  lyr.plan.clearLayers(); drawPlan(pl, lyr.tmp);
  const st = pl.stats;
  showTool('Plan calculado',
    `<b>${fmtH(st.t.total / 3600)}</b> · <b>${fmt(st.litros, 1)} L</b> · ${fmt(st.haH, 2)} ha/h · cobertura ${fmt(st.area.cobertura * 100, 1)} %<br>
     Rumbo ${pl.az}° · ${st.nVueltas} vueltas perimetrales · ${st.nPasadas} pasadas · giros U ${st.giros.U} / K ${st.giros.K} / Ω ${st.giros.O}` +
    (pl.warn.length ? '<br>⚠️ ' + pl.warn.join('<br>⚠️ ') : ''),
    [['Descartar', 'sec', () => { planRev = null; lyr.tmp.clearLayers(); drawFinca(); showMain(); }],
     ['Detalle', 'sec', () => planDetail(pl)],
     ['Guardar', '', async () => { cur.plan = pl; planVisible = true; await saveCur(); planRev = null; lyr.tmp.clearLayers(); drawFinca(); showMain(); toast('Plan guardado'); }]]);
}
function planDetail(pl) {
  const st = pl.stats, m = v => fmt(v, 0) + ' m', h = s => fmtH(s / 3600);
  sheet(`<h3>Detalle del plan</h3>
    <div class="card">
      <div class="kv"><span>Rumbo de pasadas</span><span>${pl.az}°</span></div>
      <div class="kv"><span>Vueltas perimetrales</span><span>${st.nVueltas}${pl.nH !== pl.nHauto ? ' (auto ' + pl.nHauto + ')' : ''}</span></div>
      <div class="kv"><span>Cabecera necesaria</span><span>${fmt(pl.need, 1)} m</span></div>
      <div class="kv"><span>Vueltas a exclusiones</span><span>${st.nObs}</span></div>
      <div class="kv"><span>Pasadas interiores</span><span>${st.nPasadas}</span></div>
      <div class="kv"><span>Giros U / K (marcha atrás) / Ω</span><span>${st.giros.U} / ${st.giros.K} / ${st.giros.O}</span></div>
      <div class="kv"><span>Rodeos de exclusión</span><span>${st.giros.rodeo}</span></div>
      <div class="kv"><span>Traslados</span><span>${st.giros.tras}</span></div>
      <div class="kv"><span>Esquinas con maniobra</span><span>${st.esquinas}</span></div>
    </div>
    <div class="card"><h3>Recorrido</h3>
      <div class="kv"><span>Trabajando</span><span>${m(st.L.trabajo)}</span></div>
      <div class="kv"><span>Giros</span><span>${m(st.L.giro)}</span></div>
      <div class="kv"><span>Marcha atrás</span><span>${m(st.L.reversa)}</span></div>
      <div class="kv"><span>Traslados</span><span>${m(st.L.traslado)}</span></div>
      <div class="kv"><span>Total trayectoria ideal</span><span>${m(st.L.total)}</span></div>
    </div>
    <div class="card"><h3>Tiempo y combustible</h3>
      <div class="kv"><span>Trabajando</span><span>${h(st.t.trabajo)}</span></div>
      <div class="kv"><span>Giros y maniobras</span><span>${h(st.t.giros + st.t.esquinas)}</span></div>
      <div class="kv"><span>Traslados</span><span>${h(st.t.traslado)}</span></div>
      <div class="kv"><span>Total</span><span>${h(st.t.total)}</span></div>
      <div class="kv"><span>Combustible (${fmt(pl.params.consumo, 1)} L/h)</span><span>${fmt(st.litros, 1)} L</span></div>
      <div class="kv"><span>Rendimiento</span><span>${fmt(st.haH, 2)} ha/h · ${fmt(st.litros / (st.area.objetivo / 10000 || 1), 1)} L/ha</span></div>
      <div class="kv"><span>Tiempo productivo</span><span>${fmt(st.t.trabajo / st.t.total * 100, 0)} %</span></div>
    </div>
    <div class="card"><h3>Superficie</h3>
      <div class="kv"><span>A limpiar</span><span>${fmtArea(st.area.objetivo)}</span></div>
      <div class="kv"><span>Cubierta por el plan</span><span>${fmtArea(st.area.cubierta)}</span></div>
      <div class="kv"><span>No alcanzada (esquinas, bordes)</span><span>${fmtArea(st.area.noAlcanzada)}</span></div>
      <div class="kv"><span>Cobertura teórica</span><span>${fmt(st.area.cobertura * 100, 1)} %</span></div>
    </div>
    <div class="note">Azul continuo: trabajo · azul fino: giros · discontinuo: marcha atrás · punteado: traslado. Calculado en ${pl.ms} ms.</div>`);
}

/* ---------- Panel de herramienta genérico ---------- */
function showTool(title, hint, btns) {
  $('tbMain').classList.add('hidden'); $('pRec').classList.add('hidden'); $('pTool').classList.remove('hidden');
  $('toolTitle').textContent = title; $('toolHint').innerHTML = hint;
  const host = $('toolBtns'); host.innerHTML = '';
  btns.forEach(([txt, cls, fn, dis]) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = txt; b.disabled = !!dis; b.onclick = fn; host.appendChild(b); });
}

$('tExcl').onclick = exclMenu;
$('tEdit').onclick = editMenu;
$('tPlan').onclick = planMenu;
$('tInfo').onclick = () => { if (!busy()) infoSheet(); };
