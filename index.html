<style>
:root{
  --bg:#f2f3f5;--card:#fff;--txt:#1c1c1e;--sub:#6b7280;--line:#e3e5e8;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;border:0;cursor:pointer}
input,select{font:inherit}
.hidden{display:none!important}
header{position:fixed;top:0;left:0;right:0;z-index:1000;background:#fff;border-bottom:1px solid var(--line);
  padding:calc(var(--safe-t) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;min-height:52px}
header h1{font-size:17px;margin:0;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:none;color:var(--pri);font-size:16px;padding:6px 8px;min-width:64px;text-align:left}
.hbtn.r{text-align:right}
main{position:fixed;top:calc(var(--safe-t) + 52px);left:0;right:0;bottom:0;overflow:auto}
.view{padding:14px 14px calc(var(--safe-b) + 90px)}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.finca{display:flex;align-items:center;gap:12px}
.finca .ic{width:44px;height:44px;border-radius:10px;background:var(--pri2);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.finca .t{font-weight:600}.finca .s{color:var(--sub);font-size:13px}
.empty{color:var(--sub);text-align:center;padding:40px 10px}
.fab{position:fixed;right:18px;bottom:calc(var(--safe-b) + 18px);z-index:900;background:var(--pri);color:#fff;
  border-radius:28px;padding:14px 20px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.2)}
label.f{display:block;margin:10px 0 4px;color:var(--sub);font-size:13px}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{padding:12px 14px;border-radius:10px;background:var(--pri);color:#fff;font-weight:600;width:100%}
.btn.sec{background:#e9ecef;color:var(--txt)}.btn.err{background:var(--err)}.btn.warn{background:var(--warn)}
.btn:disabled{opacity:.45}
.seg{display:flex;background:#e9ecef;border-radius:10px;padding:3px}
.seg button{flex:1;background:none;padding:8px;border-radius:8px}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:600}
h3{margin:4px 0 8px;font-size:15px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border:0}.kv span:first-child{color:var(--sub)}.kv span:last-child{font-weight:600;text-align:right}
.note{font-size:12px;color:var(--sub);margin-top:6px}
.sgrp{margin-bottom:6px;font-size:12px;text-transform:uppercase;color:var(--sub);letter-spacing:.04em;margin-top:14px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border:0}.srow span{flex:1}.srow input{width:110px;text-align:right}
/* mapa */
#mapWrap{position:fixed;top:calc(var(--safe-t) + 52px);left:0;right:0;bottom:0}
#map{position:absolute;inset:0}
.tb{position:absolute;left:8px;right:8px;bottom:calc(var(--safe-b) + 10px);z-index:800;display:flex;gap:6px;
  background:rgba(255,255,255,.96);border-radius:14px;padding:6px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.tb button{flex:1;background:none;padding:6px 2px;border-radius:10px;font-size:11px;color:var(--txt);display:flex;flex-direction:column;align-items:center;gap:2px}
.tb button b{font-size:19px;font-weight:400;line-height:1}
.tb button:active{background:#eef}
.mbtn{position:absolute;right:10px;z-index:800;width:42px;height:42px;border-radius:21px;background:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:19px;display:flex;align-items:center;justify-content:center}
#bLoc{top:96px}
.sheetBg{position:fixed;inset:0;z-index:1500;background:rgba(0,0,0,.3)}
.sheet{position:fixed;padding-top:14px;left:0;right:0;bottom:0;z-index:1600;background:var(--bg);border-radius:16px 16px 0 0;
  padding:12px 14px calc(var(--safe-b) + 14px);max-height:80vh;overflow:auto;box-shadow:0 -4px 20px rgba(0,0,0,.2)}

  border-radius:14px;padding:10px 12px;box-shadow:0 2px 12px rgba(0,0,0,.22)}

.panel .title{font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}

.dot.rec{animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.acc-ok{color:var(--pri)}.acc-mid{color:var(--warn)}.acc-bad{color:var(--err)}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 110px);transform:translateX(-50%);z-index:3000;background:rgba(30,30,30,.92);

.vtx.ex{border-color:#b71c1c}

.mid{width:14px;height:14px;border-radius:7px;background:rgba(255,255,255,.7);border:2px dashed #1b5e20}

.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}

table.cmp td{padding:6px 8px;border-left:1px solid var(--line);white-space:nowrap;font-weight:600}
table.cmp tr+tr>*{border-top:1px solid var(--line)}
.covimg{image-rendering:pixelated}
#bLay{top:146px}
#pWork .stats b{font-size:20px}
.gpsChip{position:absolute;left:8px;top:8px;z-index:820;background:rgba(255,255,255,.97);border-radius:18px;
  padding:6px 12px;font-size:13px;font-weight:600;box-shadow:0 1px 6px rgba(0,0,0,.25);display:flex;align-items:center;gap:6px;white-space:nowrap}

.leaflet-top.leaflet-left{margin-top:46px}

.btn.big{padding:16px 10px;font-size:18px}

#pWork .stats.wst{grid-template-columns:repeat(4,1fr);margin-bottom:8px}#pWork .stats.wst b{font-size:17px}
.wtools button.off{opacity:.45;text-decoration:line-through}
/* alto contraste para pleno sol */
body.hc #pWork{background:#fff;border:3px solid #000;box-shadow:none}
body.hc #pWork .stats div{background:#fff;border:2px solid #000}
body.hc #pWork .stats b{font-size:20px;color:#000!important}
body.hc #pWork .stats small,body.hc .lbnext{color:#000;font-weight:700}
body.hc #pWork .btn{border:3px solid #000;font-size:21px;font-weight:800}
body.hc .lbar{height:42px}body.hc .lbar i{background:#bdbdbd}
body.hc .lbar i.g{background:#1b5e20}body.hc .lbar i.o{background:#e65100}body.hc .lbar i.r{background:#b71c1c}body.hc .lbar i.c{outline:3px solid #000}
body.hc .lbinfo b{font-size:34px}body.hc .gpsChip{border:2px solid #000;font-size:15px}
.lnk{display:block;margin:10px auto 0;background:none;color:var(--sub);font-size:14px;text-decoration:underline}.st-pause{background:#ef6c00!important}
.gtab td{padding:5px 0;border-bottom:1px solid var(--line)}.gtab td:last-child{text-align:right;font-weight:600}
.leaflet-control-layers{border-radius:10px!important}
.leaflet-top{top:4px}

<body>

<header>
  <button class="hbtn" id="hLeft"></button>

  <button class="hbtn r" id="hRight"></button>
</header>

<!-- LISTA -->
<main id="vList"><div class="view">
  <div id="fincaList"></div>
</div></main>
<button class="fab" id="bNueva">＋ Nueva finca</button>

<!-- AJUSTES -->

<!-- MAPA -->
<div id="mapWrap" class="hidden">
  <div id="map"></div>
  <button class="gpsChip" id="gpsChip"><span class="gdot"></span><span id="gpsTxt">GPS apagado</span></button>
  <button class="mbtn" id="bLoc" title="Mi posición">◎</button>

    <div id="wGuide">
      <div class="lbar" id="wBar"></div>
      <div class="lbinfo"><b id="wSteer">–</b><span id="wPass">Sin plan</span></div>
      <div class="lbnext" id="wNext"></div>
    </div>
    <div class="stats wst">
      <div><b id="wSpd">–</b><small>km/h</small></div>
      <div><b id="wCov">–</b><small>Limpio</small></div>
      <div><b id="wTime">–</b><small>Tiempo</small></div>
      <div><b id="wLit">–</b><small>Litros</small></div>
      <div class="hidden"><b id="wDev">–</b><small id="wDevL"></small><b id="wEta">–</b></div>
    </div>
    <button class="btn big" id="wApero" style="margin-bottom:8px">🟢 APERO EN TRABAJO</button>
    <div class="row"><button class="btn big" id="wPause">▶ Iniciar</button><button class="btn big err" id="wEnd">■ Parar</button></div>
    <div class="wtools"><button id="wVoz">🔊 Voz</button><button id="wHC">☀️ Contraste</button><span>GPS <b id="wAcc">–</b></span></div>

  <div class="tb" id="tbMain">
    <button id="tLinde"><b>⬠</b>Linde</button>
    <button id="tExcl"><b>⛔</b>Exclusión</button>
    <button id="tEdit"><b>✎</b>Editar</button>
    <button id="tPlan"><b>🧭</b>Plan</button>

    <button id="tInfo"><b>ⓘ</b>Datos</button>
  </div>
  <!-- panel grabación -->
  <div class="panel hidden" id="pRec">
    <div class="title"><span class="dot rec" id="recDot"></span><span id="recTitle">Midiendo</span></div>
    <div class="stats">
      <div><b id="sAcc">–</b><small>Precisión</small></div>
      <div><b id="sPts">0</b><small>Puntos</small></div>
      <div><b id="sLen">0 m</b><small>Recorrido</small></div>
    </div>

    <div class="row">
      <button class="btn big" id="bPause">▶ Iniciar</button>
      <button class="btn big" id="bCorner" style="background:#1565c0;white-space:nowrap;font-size:16px">📍 Esquina</button>
      <button class="btn big err" id="bFin">■ Parar</button>
    </div>
    <button class="lnk" id="bCancelRec">Cancelar y descartar</button>
  </div>
  <!-- panel dibujo / edición / revisión -->
  <div class="panel hidden" id="pTool">
    <div class="title" id="toolTitle"></div>
    <div class="note" id="toolHint" style="margin:-2px 0 8px"></div>
    <div class="row" id="toolBtns"></div>
  </div>
</div>

<div id="sheetHost"></div>

<script>
'use strict';
/* =========================================================
   LIMPFINC · F1 — Fincas, linde, exclusiones, área
   ========================================================= */
const VERSION = '0.9.0';

/* ---------- Ajustes por defecto ---------- */
const DEF = {
  voz:true, altoContraste:false, umbralAuto:true,
  tractor:'New Holland TN95F', potencia:95,
  radioGiro:4.0, marchaAtras:true,
  aperoNombre:'Desbrozadora de cadenas', aperoAncho:1.70, offsetApero:2.0,
  velocidad:2.5, consumo:5.0, solape:0.10, umbralDesv:1.0,
  anchoTractor:1.70, longTractorApero:5.0,
  umbralPrecision:8, holguraLinde:0.5,
  mallaX:3.5, mallaY:3.5, holguraTronco:0.30,
  mapaBase:'OpenStreetMap',
  consumoAuto:true, velocidadGiro:3.0, velocidadTraslado:5.0, tCambioSentido:4, tManiobra:20, tEsquina:15, margenObstaculo:0.30
};
const SET_FIELDS = [
  ['Tractor',[['tractor','Modelo','text'],['potencia','Potencia (CV)'],['anchoTractor','Ancho tractor (m)'],
    ['longTractorApero','Longitud tractor + apero (m)'],['radioGiro','Radio de giro mínimo (m)'],['marchaAtras','Maniobras marcha atrás','bool']]],
  ['Apero',[['aperoNombre','Apero','text'],['aperoAncho','Ancho de trabajo (m)'],['offsetApero','iPhone → centro apero (m)']]],
  ['Trabajo',[['velocidad','Velocidad por defecto (km/h)'],['consumo','Consumo (L/h)'],['consumoAuto','Usar consumo calibrado en repostajes','bool'],['solape','Solape entre pasadas (m)'],['umbralDesv','Umbral desviación mínimo (m)'],['umbralAuto','Umbral automático según precisión GPS','bool'],['voz','Avisos por voz en el modo trabajo','bool'],['altoContraste','Alto contraste en el modo trabajo','bool']]],
  ['Planificación',[['velocidadGiro','Velocidad en giros (km/h)'],['velocidadTraslado','Velocidad en traslados (km/h)'],['tCambioSentido','Tiempo cambio de sentido (s)'],
    ['tManiobra','Maniobra al iniciar traslado (s)'],['tEsquina','Maniobra en esquina (s)'],['margenObstaculo','Margen a exclusiones (m)']]],
  ['Medición GPS',[['umbralPrecision','Descartar puntos con precisión peor que (m)'],['holguraLinde','Holgura lateral tractor–linde (m)']]],
  ['Monte',[['mallaX','Separación entre filas (m)'],['mallaY','Separación en fila (m)'],['holguraTronco','Holgura al tronco (m)']]]
];

/* ---------- IndexedDB ---------- */
const DB = (() => {
  let db;
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('limpfinc', 2);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('fincas')) d.createObjectStore('fincas', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      if (!d.objectStoreNames.contains('trabajos')) d.createObjectStore('trabajos', { keyPath: 'id' });
    };
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
  const tx = (st, mode, fn) => new Promise((res, rej) => {
    const t = db.transaction(st, mode), s = t.objectStore(st); const q = fn(s);
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error);
  });
  return {
    open,
    all: () => tx('fincas', 'readonly', s => s.getAll()),
    get: id => tx('fincas', 'readonly', s => s.get(id)),
    put: f => tx('fincas', 'readwrite', s => s.put(f)),
    del: id => tx('fincas', 'readwrite', s => s.delete(id)),
    kvGet: k => tx('kv', 'readonly', s => s.get(k)),
    kvPut: (k, v) => tx('kv', 'readwrite', s => s.put(v, k)),
    tAll: () => tx('trabajos', 'readonly', s => s.getAll()),
    tByFinca: async fid => (await tx('trabajos', 'readonly', s => s.getAll())).filter(t => t.fincaId === fid).sort((a, b) => b.inicio - a.inicio),
    tPut: t => tx('trabajos', 'readwrite', s => s.put(t)),
    tDel: id => tx('trabajos', 'readwrite', s => s.delete(id))
  };
})();

/* ---------- Geometría (plano local métrico, WGS84) ---------- */
const D2R = Math.PI / 180;
const Geo = {
  proj(lat0, lon0) {
    const a = 6378137, e2 = 6.69437999014e-3, s = Math.sin(lat0 * D2R), w = 1 - e2 * s * s;
    const N = a / Math.sqrt(w), M = a * (1 - e2) / (w * Math.sqrt(w));
    const kx = N * Math.cos(lat0 * D2R) * D2R, ky = M * D2R;
    return { fwd: (lat, lon) => [(lon - lon0) * kx, (lat - lat0) * ky], inv: (x, y) => [lat0 + y / ky, lon0 + x / kx] };
  },
  projFor(ll) { // ll: [[lat,lon],...]
    let la = 0, lo = 0; ll.forEach(p => { la += p[0]; lo += p[1]; });
    return Geo.proj(la / ll.length, lo / ll.length);
  },
  toXY(ll, P) { return ll.map(p => P.fwd(p[0], p[1])); },
  toLL(xy, P) { return xy.map(p => P.inv(p[0], p[1])); },
  dist: (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]),
  signedArea(xy) { let s = 0; for (let i = 0, n = xy.length; i < n; i++) { const a = xy[i], b = xy[(i + 1) % n]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; },
  area: xy => Math.abs(Geo.signedArea(xy)),
  perim(xy, closed = true) { let s = 0; for (let i = 0; i < xy.length - (closed ? 0 : 1); i++) s += Geo.dist(xy[i], xy[(i + 1) % xy.length]); return s; },
  lenLL(ll) { if (ll.length < 2) return 0; const P = Geo.projFor(ll); return Geo.perim(Geo.toXY(ll, P), false); },
  areaLL(ll) { if (ll.length < 3) return 0; const P = Geo.projFor(ll); return Geo.area(Geo.toXY(ll, P)); },
  perimLL(ll) { if (ll.length < 2) return 0; const P = Geo.projFor(ll); return Geo.perim(Geo.toXY(ll, P), true); },
  decimate(xy, dmin) { if (!xy.length) return []; const o = [xy[0]]; for (const p of xy) if (Geo.dist(o[o.length - 1], p) >= dmin) o.push(p); return o; },
  smooth(xy, k) { // media móvil abierta, ventana 2k+1
    const n = xy.length; if (n < 2 * k + 1) return xy.slice();
    return xy.map((_, i) => { let sx = 0, sy = 0, c = 0; for (let j = Math.max(0, i - k); j <= Math.min(n - 1, i + k); j++) { sx += xy[j][0]; sy += xy[j][1]; c++; } return [sx / c, sy / c]; });
  },
  dp(xy, eps) { // Douglas-Peucker
    if (xy.length < 3) return xy.slice();
    const keep = new Uint8Array(xy.length); keep[0] = keep[xy.length - 1] = 1;
    const st = [[0, xy.length - 1]];
    while (st.length) {
      const [i, j] = st.pop(); let dm = 0, im = -1; const a = xy[i], b = xy[j];
      const L = Geo.dist(a, b) || 1e-9;
      for (let k = i + 1; k < j; k++) { const p = xy[k]; const d = Math.abs((b[0] - a[0]) * (a[1] - p[1]) - (a[0] - p[0]) * (b[1] - a[1])) / L; if (d > dm) { dm = d; im = k; } }
      if (dm > eps && im > 0) { keep[im] = 1; st.push([i, im], [im, j]); }
    }
    return xy.filter((_, i) => keep[i]);
  },
  dpClosed(xy, eps) { // anillo cerrado: se parte por el punto más alejado del primero
    if (xy.length < 4) return xy.slice();
    let k = 1, dm = 0; xy.forEach((p, i) => { const d = Geo.dist(xy[0], p); if (d > dm) { dm = d; k = i; } });
    const a = Geo.dp(xy.slice(0, k + 1), eps), b = Geo.dp([...xy.slice(k), xy[0]], eps);
    return [...a.slice(0, -1), ...b.slice(0, -1)];
  },
  mergeClose(xy, dmin) { // fusiona vértices a menos de dmin
    const o = [];
    for (const p of xy) { const q = o[o.length - 1]; if (q && Geo.dist(p, q) < dmin) { q[0] = (q[0] + p[0]) / 2; q[1] = (q[1] + p[1]) / 2; } else o.push(p.slice()); }
    while (o.length > 3 && Geo.dist(o[0], o[o.length - 1]) < dmin) o.pop();
    return o;
  },
  ccw(xy) { return Geo.signedArea(xy) < 0 ? xy.slice().reverse() : xy; },
  offsetOut(xy, d) { // desplaza polígono CCW hacia fuera d metros (inglete limitado)
    const n = xy.length, o = [];
    for (let i = 0; i < n; i++) {
      const p0 = xy[(i - 1 + n) % n], p1 = xy[i], p2 = xy[(i + 1) % n];
      const n1 = Geo.nrm([p1[1] - p0[1], -(p1[0] - p0[0])]), n2 = Geo.nrm([p2[1] - p1[1], -(p2[0] - p1[0])]);
      let m = Geo.nrm([n1[0] + n2[0], n1[1] + n2[1]]); const c = m[0] * n1[0] + m[1] * n1[1];
      const f = d / Math.max(c, 0.5);
      o.push([p1[0] + m[0] * f, p1[1] + m[1] * f]);
    }
    return o;
  },
  nrm(v) { const l = Math.hypot(v[0], v[1]) || 1; return [v[0] / l, v[1] / l]; },
  segX(a, b, c, d) {
    const o = (p, q, r) => Math.sign((q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0]));
    return o(a, b, c) * o(a, b, d) < 0 && o(c, d, a) * o(c, d, b) < 0;
  },
  selfIntersects(xy) {
    const n = xy.length;
    for (let i = 0; i < n; i++) for (let j = i + 2; j < n; j++) {
      if (i === 0 && j === n - 1) continue;
      if (Geo.segX(xy[i], xy[(i + 1) % n], xy[j], xy[(j + 1) % n])) return true;
    }
    return false;
  },
  inPoly(p, xy) {
    let c = false;
    for (let i = 0, j = xy.length - 1; i < xy.length; j = i++) {
      const a = xy[i], b = xy[j];
      if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) c = !c;
    }
    return c;
  }
};

/* ---------- Filtro de Kalman (velocidad constante, por eje) ---------- */
const KF_Q = 0.5;            // densidad espectral de aceleración (m²/s³)
const kfR = acc => Math.max(1, acc * acc * 0.5);
// en línea (tiempo real): devuelve posición filtrada, velocidad y desviación típica
function KF2(q = KF_Q) {
  let x = null, P = null, tl = 0, rej = 0;
  return {
    step(z, acc, t) {
      const r = kfR(acc);
      if (!x || rej >= 3) { x = [[z[0], 0], [z[1], 0]]; P = [[r, 0, 0, 4], [r, 0, 0, 4]]; tl = t; rej = 0; return { p: z.slice(), v: [0, 0], speed: 0, sigma: Math.sqrt(r) }; }
      const dt = Math.max(0.05, Math.min(10, t - tl));
      const xp = [], Pp = [];
      for (let k = 0; k < 2; k++) {
        const [p0, v0] = x[k], [a, b, c, d] = P[k];
        xp[k] = [p0 + v0 * dt, v0];
        Pp[k] = [a + dt * (b + c) + dt * dt * d + q * dt ** 3 / 3, b + dt * d + q * dt * dt / 2, c + dt * d + q * dt * dt / 2, d + q * dt];
      }
      const iy = [z[0] - xp[0][0], z[1] - xp[1][0]], S0 = Pp[0][0] + r, S1 = Pp[1][0] + r;
      if (iy[0] * iy[0] / S0 + iy[1] * iy[1] / S1 > 25) { rej++; return { reject: true }; }   // salto > 5σ
      rej = 0; tl = t;
      for (let k = 0; k < 2; k++) {
        const [a, b, c, d] = Pp[k], Sk = a + r, k0 = a / Sk, k1 = c / Sk;
        x[k] = [xp[k][0] + k0 * iy[k], xp[k][1] + k1 * iy[k]];
        P[k] = [(1 - k0) * a, (1 - k0) * b, c - k1 * a, d - k1 * b];
      }
      return { p: [x[0][0], x[1][0]], v: [x[0][1], x[1][1]], speed: Math.hypot(x[0][1], x[1][1]), sigma: Math.sqrt((P[0][0] + P[1][0]) / 2) };
    }
  };
}
// fuera de línea (linde): filtro hacia delante + suavizado hacia atrás (Rauch-Tung-Striebel)
function kfSmooth(xy, acc, t, q = KF_Q) {
  const n = xy.length; if (n < 3) return xy.slice();
  const out = xy.map(() => [0, 0]);
  for (let k = 0; k < 2; k++) {
    const xf = [], Pf = [], xp = [], Pp = [];
    for (let i = 0; i < n; i++) {
      const z = xy[i][k], r = kfR(acc[i]);
      let xpi, Ppi;
      if (i === 0) { xpi = [z, 0]; Ppi = [r, 0, 0, 4]; }
      else {
        const dt = Math.max(0.05, Math.min(10, t[i] - t[i - 1])), [p0, v0] = xf[i - 1], [a, b, c, d] = Pf[i - 1];
        xpi = [p0 + v0 * dt, v0];
        Ppi = [a + dt * (b + c) + dt * dt * d + q * dt ** 3 / 3, b + dt * d + q * dt * dt / 2, c + dt * d + q * dt * dt / 2, d + q * dt];
      }
      xp[i] = xpi; Pp[i] = Ppi;
      const [a, b, c, d] = Ppi, Sk = a + r, k0 = a / Sk, k1 = c / Sk, iy = z - xpi[0];
      xf[i] = [xpi[0] + k0 * iy, xpi[1] + k1 * iy]; Pf[i] = [(1 - k0) * a, (1 - k0) * b, c - k1 * a, d - k1 * b];
    }
    let xs = xf[n - 1];
    out[n - 1][k] = xs[0];
    for (let i = n - 2; i >= 0; i--) {
      const dt = Math.max(0.05, Math.min(10, t[i + 1] - t[i])), [a, b, c, d] = Pf[i], [e, f, g, h] = Pp[i + 1];
      // C = Pf·Fᵀ·inv(Pp), con F = [[1,dt],[0,1]]
      const m00 = a + b * dt, m01 = b, m10 = c + d * dt, m11 = d, det = e * h - f * g || 1e-12;
      const i00 = h / det, i01 = -f / det, i10 = -g / det, i11 = e / det;
      const C00 = m00 * i00 + m01 * i10, C01 = m00 * i01 + m01 * i11, C10 = m10 * i00 + m11 * i10, C11 = m10 * i01 + m11 * i11;
      const d0 = xs[0] - xp[i + 1][0], d1 = xs[1] - xp[i + 1][1];
      xs = [xf[i][0] + C00 * d0 + C01 * d1, xf[i][1] + C10 * d0 + C11 * d1];
      out[i][k] = xs[0];
    }
  }
  return out;
}

/* Proceso de un recorrido GPS a polígono */
function processTrack(pts, mode, S) {
  const corners = pts.filter(p => p.corner);
  const good = pts.filter(p => !p.corner && p.acc <= S.umbralPrecision);
  if (good.length < 5 && corners.length < 3) return { error: 'Muy pocos puntos válidos (' + good.length + ' puntos, ' + corners.length + ' esquinas). Revisa la precisión GPS.' };
  const all = [...good, ...corners];
  const P = Geo.projFor(all.map(p => [p.lat, p.lon]));
  let xy;
  if (good.length < 5) {
    // solo esquinas: el polígono son las esquinas en el orden en que se tomaron
    xy = corners.map(c => P.fwd(c.lat, c.lon));
  } else {
    xy = kfSmooth(good.map(p => P.fwd(p.lat, p.lon)), good.map(p => p.acc), good.map(p => p.t / 1000));
    xy = Geo.decimate(xy, 1.0);
    while (xy.length > 4 && Geo.dist(xy[xy.length - 1], xy[0]) < 1.0) xy.pop();  // cola que solapa el inicio
    xy = Geo.dpClosed(xy, 1.0);
    xy = Geo.mergeClose(xy, 2.0);
    // las esquinas promediadas sustituyen al vértice cercano o se insertan en el lado más próximo
    corners.forEach(c => {
      const q = P.fwd(c.lat, c.lon);
      let bi = -1, bd = Infinity; xy.forEach((v, i) => { const d = Geo.dist(v, q); if (d < bd) { bd = d; bi = i; } });
      if (bd < 10) { xy[bi] = q; return; }
      let be = 0, bde = Infinity;
      for (let i = 0; i < xy.length; i++) {
        const a = xy[i], b = xy[(i + 1) % xy.length], dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy || 1e-12;
        let u = ((q[0] - a[0]) * dx + (q[1] - a[1]) * dy) / L2; u = Math.max(0, Math.min(1, u));
        const d = Math.hypot(q[0] - a[0] - u * dx, q[1] - a[1] - u * dy); if (d < bde) { bde = d; be = i; }
      }
      xy.splice(be + 1, 0, q);
    });
    // entre esquinas los lados se simplifican más (solo se conservan quiebros reales > 2 m)
    if (corners.length >= 2) {
      const cq = corners.map(c => P.fwd(c.lat, c.lon));
      const isC = v => cq.some(q => q[0] === v[0] && q[1] === v[1]);
      const ci = xy.map((v, i) => isC(v) ? i : -1).filter(i => i >= 0);
      if (ci.length >= 2) {
        const out = [];
        for (let k = 0; k < ci.length; k++) {
          const a = ci[k], b = ci[(k + 1) % ci.length];
          const seg = []; for (let i = a; ; i = (i + 1) % xy.length) { seg.push(xy[i]); if (i === b) break; }
          const simp = Geo.dp(seg, 2.0); simp.pop(); out.push(...simp);
        }
        xy = out;
      }
    }
  }
  if (xy.length < 3) return { error: 'El recorrido no forma un polígono.' };
  xy = Geo.ccw(xy);
  let off = 0;
  if (mode === 'tractor') {
    off = S.anchoTractor / 2 + S.holguraLinde;
    xy = Geo.offsetOut(xy, off);
  }
  const seq = good.length >= 5 ? good : corners;
  const gap = Geo.dist(P.fwd(seq[0].lat, seq[0].lon), P.fwd(seq[seq.length - 1].lat, seq[seq.length - 1].lon));
  return {
    coords: Geo.toLL(xy, P), offset: off, gap: good.length >= 5 ? gap : 0,
    selfX: Geo.selfIntersects(xy),
    used: good.length, total: pts.length - corners.length, nCorners: corners.length,
    accMed: all.reduce((s, p) => s + p.acc, 0) / all.length,
    accCorners: corners.length ? corners.reduce((s, p) => s + p.acc, 0) / corners.length : null
  };
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function toast(msg, ms = 2500) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }

const normName = n => n.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, ' ');
async function findByName(nombre, exceptId) { const k = normName(nombre); return (await DB.all()).find(f => normName(f.nombre) === k && f.id !== exceptId); }

/* Alta: 1) nombre → 2) si no existe, tipo y modo de medición del linde */
function nuevaFinca() {
  sheet(`<h3>Nueva finca</h3>
    <label class="f">Nombre de la finca</label><input class="inp" id="nNom" placeholder="p. ej. Leira do Souto" autocomplete="off">
    <button class="btn" id="nOk" style="margin-top:14px">Continuar</button>`,
    () => {
      const go = async () => {
        const nombre = $('nNom').value.trim(); if (!nombre) return toast('Indica un nombre');
        const ex = await findByName(nombre);
        if (ex) { closeSheet(); toast(`«${ex.nombre}» ya existe: se abre`); openFinca(ex.id); return; }
        nuevaFincaMedir(nombre);
      };
      $('nOk').onclick = go; $('nNom').onkeydown = e => { if (e.key === 'Enter') go(); };
      setTimeout(() => $('nNom').focus(), 50);
    });
}
function nuevaFincaMedir(nombre) {
  let tipo = 'abierta';
  sheet(`<h3>${esc(nombre)}</h3><div class="note" style="margin-bottom:6px">No está registrada. Indica el tipo y cómo medir su superficie.</div>
    <label class="f">Tipo</label>
    <div class="seg" id="nTipo"><button data-v="abierta">🌾 Abierta</button><button data-v="monte">🌲 Monte / plantación</button></div>
    <label class="f">Medición del linde</label>
    <button class="opt" id="nPie">🚶 A pie<small>Recorre el linde con el iPhone. Máxima precisión.</small></button>
    <button class="opt" id="nTrac">🚜 Con tractor<small>Recorre el interior junto al linde; se corrige hacia fuera.</small></button>
    <button class="opt" id="nLuego" style="color:var(--sub)">Más tarde<small>Crear la finca sin medir.</small></button>`,
    () => {
      const seg = $('nTipo'), paint = () => seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === tipo));
      seg.querySelectorAll('button').forEach(b => b.onclick = () => { tipo = b.dataset.v; paint(); }); paint();
      const crear = async modo => {
        const now = Date.now(), nf = { id: uid(), nombre, tipo, notas: '', creada: now, mod: now, linde: null, exclusiones: [] };
        await DB.put(nf); closeSheet(); await openFinca(nf.id);
        if (modo === 'pie') startRec('linde', 'pie'); else if (modo === 'tractor') tractorSetup();
      };
      $('nPie').onclick = () => crear('pie'); $('nTrac').onclick = () => crear('tractor'); $('nLuego').onclick = () => crear(null);

}
function fincaForm(f) {
  sheet(`<h3>Editar finca</h3>
    <label class="f">Nombre</label><input class="inp" id="fNom" value="${esc(f.nombre)}">
    <label class="f">Tipo</label>
    <div class="seg" id="fTipo"><button data-v="abierta">🌾 Abierta</button><button data-v="monte">🌲 Monte / plantación</button></div>
    <label class="f">Notas</label><input class="inp" id="fNot" value="${esc(f.notas || '')}">
    <div class="row" style="margin-top:14px"><button class="btn err" id="fDel">Eliminar</button><button class="btn" id="fOk">Guardar</button></div>`,
    () => {
      let tipo = f.tipo;
      const seg = $('fTipo'); const paint = () => seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === tipo));
      seg.querySelectorAll('button').forEach(b => b.onclick = () => { tipo = b.dataset.v; paint(); }); paint();
      $('fOk').onclick = async () => {
        const nombre = $('fNom').value.trim(); if (!nombre) { toast('Indica un nombre'); return; }
        if (await findByName(nombre, f.id)) return toast('Ya existe otra finca con ese nombre');
        Object.assign(f, { nombre, tipo, notas: $('fNot').value.trim(), mod: Date.now() });
        delete f.refCat;
        await DB.put(f); closeSheet(); cur = f; setHeader('‹ Fincas', f.nombre, '⋯', () => { if (busy()) return toast('Termina o cancela la operación en curso'); stopGPS(); showList(); }, fincaMenu);
      };
      $('fDel').onclick = () => confirmSheet(`¿Eliminar «${esc(f.nombre)}» y todos sus datos?`, 'Eliminar', async () => { for (const t of await DB.tByFinca(f.id)) await DB.tDel(t.id); await DB.del(f.id); cur = null; stopGPS(); showList(); }, true);
    });
}

function fincaAreas(f) {
  const bruta = f.linde ? Geo.areaLL(f.linde.coords) : 0;
  const excl = (f.exclusiones || []).reduce((s, e) => s + Geo.areaLL(e.coords), 0);
  return { bruta, excl, neta: Math.max(0, bruta - excl), perim: f.linde ? Geo.perimLL(f.linde.coords) : 0 };
}

async function exportBackup() {

async function importBackup(e) {

  // Solo fuentes libres: OSM (ODbL), OpenTopoMap (CC BY-SA), PNOA del IGN (CC BY 4.0)
  const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { subdomains: 'abc', maxNativeZoom: 17, maxZoom: 21, attribution: '© OpenStreetMap · SRTM · © OpenTopoMap (CC BY-SA)' });

/* ---------- GPS ---------- */
let watchId = null, lastPos = null, wakeLock = null;
const GPS = { estado: 'off', err: '', n: 0, t0: 0, alt: null, altAcc: null, rx: 0 };
const PERM_TXT = 'Ajustes del iPhone › Privacidad y seguridad › Localización › Sitios web de Safari → «Al usar la app» y «Ubicación exacta» activada. Revisa también Ajustes › Apps › Safari › Ubicación → «Permitir».';
function startGPS() {
  if (watchId !== null) return;
  if (!window.isSecureContext) { GPS.estado = 'nohttps'; GPS.err = 'La app debe abrirse desde una dirección https:// (p. ej. GitHub Pages). Abierta como archivo local, el iPhone no da la ubicación.'; updGpsChip(); toast(GPS.err, 6000); return; }
  if (!('geolocation' in navigator)) { GPS.estado = 'error'; GPS.err = 'Este navegador no ofrece geolocalización.'; updGpsChip(); return; }
  GPS.estado = 'wait'; GPS.err = ''; GPS.t0 = Date.now(); updGpsChip();
  watchId = navigator.geolocation.watchPosition(onPos, err => {
    if (err.code === 1) { GPS.estado = 'denied'; GPS.err = 'Permiso de ubicación denegado. ' + PERM_TXT; stopGPS(); toast('Permiso de ubicación denegado. Toca el indicador GPS para ver cómo activarlo.', 5000); }
    else if (err.code === 3) { GPS.estado = 'wait'; GPS.err = 'Sin señal todavía (tiempo de espera agotado). Sal a cielo abierto.'; }
    else { GPS.estado = 'error'; GPS.err = 'GPS: ' + err.message; }
    updGpsChip();
  }, { enableHighAccuracy: true, maximumAge: 0, timeout: 30000 });
}
function stopGPS() { if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; } if (GPS.estado !== 'denied' && GPS.estado !== 'nohttps') GPS.estado = 'off'; updGpsChip(); }
function gpsAge() { return lastPos ? (Date.now() - lastPos.rx) / 1000 : Infinity; }
function updGpsChip() {
  const ch = $('gpsChip'); if (!ch) return;
  let cls = 'g-bad', txt = 'GPS inactivo';
  const age = gpsAge();
  if (GPS.estado === 'denied') txt = 'GPS sin permiso';
  else if (GPS.estado === 'nohttps') txt = 'GPS: requiere https';
  else if (GPS.estado === 'error') txt = 'GPS error';
  else if (lastPos && age < 10 && GPS.estado === 'ok') { cls = 'g-ok'; txt = `GPS activo · ±${fmt(lastPos.acc, lastPos.acc < 10 ? 1 : 0)} m`; }
  else if (GPS.estado === 'wait' || (GPS.estado === 'ok' && age >= 10)) { cls = 'g-wait'; txt = 'GPS buscando señal…'; }
  ch.className = 'gpsChip ' + cls; $('gpsTxt').textContent = txt;
}
setInterval(updGpsChip, 1000);
function gpsSheet() {
  startGPS();
  const row = (k, v) => `<tr><td>${k}</td><td>${v}</td></tr>`;
  const paint = () => {
    const el = $('gpsBody'); if (!el) { clearInterval(tm); return; }
    const p = lastPos, age = gpsAge();
    let est = { off: 'Apagado', wait: 'Buscando señal…', ok: 'Recibiendo', denied: 'Sin permiso', nohttps: 'Requiere https', error: 'Error' }[GPS.estado] || GPS.estado;
    if (GPS.estado === 'ok' && age > 10) est = 'Sin lecturas recientes';
    el.innerHTML = `<table class="gtab" style="width:100%;border-collapse:collapse">
      ${row('Estado', est)}
      ${row('Precisión horizontal', p ? '±' + fmt(p.acc, 1) + ' m ' + (p.acc <= 5 ? '✅ buena' : p.acc <= S.umbralPrecision ? '🟠 aceptable' : '🔴 insuficiente (> ' + S.umbralPrecision + ' m)') : '–')}
      ${row('Latitud', p ? p.lat.toFixed(7) + '°' : '–')}
      ${row('Longitud', p ? p.lon.toFixed(7) + '°' : '–')}
      ${row('Altitud', GPS.alt != null ? fmt(GPS.alt, 1) + ' m' + (GPS.altAcc != null ? ' (±' + fmt(GPS.altAcc, 0) + ')' : '') : '–')}
      ${row('Velocidad', p && p.spd != null && p.spd >= 0 ? fmt(p.spd * 3.6, 1) + ' km/h' : '–')}
      ${row('Rumbo', p && p.hdg != null && !isNaN(p.hdg) ? fmt(p.hdg, 0) + '°' : '–')}
      ${row('Última lectura', p ? (age < 1.5 ? 'ahora' : 'hace ' + Math.round(age) + ' s') : '–')}
      ${row('Lecturas recibidas', GPS.n)}
      ${row('Conexión segura (https)', window.isSecureContext ? 'Sí' : 'No')}
      </table>${GPS.err ? `<div class="card" style="margin-top:10px;background:#ffebee;color:#b71c1c">${esc(GPS.err)}</div>` : ''}
      <div class="note" style="margin-top:8px">La primera posición puede tardar 10–60 s y llegar con poca precisión (wifi/antenas). Espera a que baje de ${S.umbralPrecision} m antes de medir. Cielo abierto, lejos de edificios y árboles densos.</div>`;
  };
  sheet(`<h3>📡 Estado del GPS</h3><div id="gpsBody"></div>
    <div class="row" style="margin-top:12px"><button class="btn sec" id="gRe">Reiniciar GPS</button><button class="btn" id="gMap" ${cur ? '' : 'disabled'}>Ver en el mapa</button></div>`,
    () => {
      $('gRe').onclick = () => { if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; } GPS.estado = 'off'; GPS.err = ''; startGPS(); paint(); };
      $('gMap').onclick = () => { closeSheet(); if (lastPos && map) { followPos = true; map.setView([lastPos.lat, lastPos.lon], Math.max(map.getZoom(), 18)); } };
    });
  paint(); const tm = setInterval(paint, 1000);
}
$('gpsChip').onclick = gpsSheet;
function onPos(p) {
  const c = p.coords;
  GPS.estado = 'ok'; GPS.err = ''; GPS.n++; GPS.alt = c.altitude; GPS.altAcc = c.altitudeAccuracy;
  lastPos = { lat: c.latitude, lon: c.longitude, acc: c.accuracy, t: p.timestamp, rx: Date.now(), spd: c.speed, hdg: c.heading };
  updGpsChip();
  const ll = [c.latitude, c.longitude];
  if (!posMarker) {
    posCircle = L.circle(ll, { radius: c.accuracy, color: '#1e88e5', weight: 1, fillOpacity: .12, interactive: false }).addTo(map);
    posMarker = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="pos"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }), interactive: false, zIndexOffset: 1000 }).addTo(map);
  } else { posMarker.setLatLng(ll); posCircle.setLatLng(ll).setRadius(c.accuracy); }
  if (followPos) {
    // centra la posición en la parte visible del mapa (por encima del panel inferior)
    const pan = ['pWork', 'pRec', 'pTool'].map($).find(el => el && !el.classList.contains('hidden'));
    const z = map.getZoom() < 17 ? 18 : map.getZoom(), off = pan ? pan.offsetHeight / 2 : 0;
    map.setView(map.unproject(map.project(ll, z).add([0, off]), z), z, { animate: false });
  }
  if (rec) recPoint(lastPos);
  if (work) workPoint(lastPos);
}
$('bLoc').onclick = () => {
  startGPS();
  if (lastPos) { followPos = true; map.setView([lastPos.lat, lastPos.lon], Math.max(map.getZoom(), 18)); }
  else toast('Esperando posición GPS…');
};
async function keepAwake(on) {
  try {
    if (on && 'wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); }
    else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { /* no soportado */ }
}
document.addEventListener('visibilitychange', () => {
  // al volver a primer plano, si el GPS se quedó parado, se reinicia
  if (document.visibilityState === 'visible' && watchId !== null && gpsAge() > 5) { navigator.geolocation.clearWatch(watchId); watchId = null; startGPS(); }
  if (document.visibilityState === 'visible' && rec) { keepAwake(true); }
  if (document.visibilityState === 'hidden' && rec) rec.hiddenAt = Date.now();
  if (document.visibilityState === 'visible' && rec && rec.hiddenAt) {
    const s = Math.round((Date.now() - rec.hiddenAt) / 1000); rec.hiddenAt = 0;
    if (s > 3) toast(`La app estuvo en segundo plano ${s} s: el GPS no registró ese tramo.`, 4500);
  }
});

function startRec(target, mode) {
  startGPS(); keepAwake(true);
  rec = { target, mode, pts: [], state: 'ready', paused: true, line: L.polyline([], { color: '#ff6f00', weight: 4 }).addTo(lyr.tmp) };
  followPos = true;
  $('tbMain').classList.add('hidden'); $('pRec').classList.remove('hidden');
  paintRec(); updRecStats();

}
function paintRec() {
  const st = rec.state, name = (rec.target === 'linde' ? 'Linde' : 'Exclusión') + ' · ' + (rec.mode === 'pie' ? 'a pie' : 'con tractor');
  $('recTitle').textContent = { ready: 'Preparado · ', rec: 'Grabando · ', pause: 'En pausa · ' }[st] + name;
  const dot = $('recDot'); dot.className = 'dot' + (st === 'rec' ? ' rec' : st === 'ready' ? ' st-ready' : ' st-pause');
  const bp = $('bPause');
  bp.textContent = st === 'ready' ? '▶ Iniciar' : st === 'rec' ? '⏸ Pausar' : '▶ Continuar';
  bp.className = 'btn big ' + (st === 'rec' ? 'warn' : '');
  $('bFin').classList.toggle('hidden', st === 'ready');
  $('bCorner').classList.toggle('hidden', st === 'ready');
  if (!rec.avg) $('bCorner').textContent = '📍 Esquina';
  const como = rec.mode === 'tractor'
    ? 'Con tractor: circula por DENTRO de la finca, lo más pegado posible al borde. La app desplaza el trazado hacia fuera (' + fmt(S.anchoTractor / 2 + S.holguraLinde, 2) + ' m).'
    : 'A pie: camina POR EL BORDE de la finca. Es la medición más precisa.';
  if (st === 'ready') $('recHint').textContent = como + ' Ve al punto de partida y pulsa «Iniciar».';
  else if (st === 'rec') $('recHint').textContent = 'Registrando el trazado… En cada esquina, párate y pulsa «📍 Esquina» (20 s quieto) para fijarla con más precisión. «Parar» al terminar.';
  else $('recHint').textContent = 'En pausa: no se registra nada. Pulsa «Continuar» y el trazado seguirá desde el último punto.';
}
function recPoint(p) {
  updRecStats(p);
  if (rec.avg) { if (p.acc <= S.umbralPrecision * 1.5 && (!rec.avg.s.length || p.t !== rec.avg.s[rec.avg.s.length - 1].t)) rec.avg.s.push(p); return; }
  if (rec.state !== 'rec') return;
  const last = rec.pts[rec.pts.length - 1];
  if (last && p.t - last.t < 900) return; // ~1 Hz
  rec.pts.push(p);
  if (p.acc <= S.umbralPrecision) rec.line.addLatLng([p.lat, p.lon]);
  updRecStats(p);
}
function updRecStats(p) {
  p = p || lastPos;
  if (p) {
    const a = p.acc; const el = $('sAcc');
    el.textContent = '±' + fmt(a, a < 10 ? 1 : 0) + ' m';
    el.className = a <= 5 ? 'acc-ok' : a <= S.umbralPrecision ? 'acc-mid' : 'acc-bad';
  }
  { const nc = rec.pts.filter(q => q.corner).length; $('sPts').textContent = (rec.pts.length - nc) + (nc ? ' · ' + nc + '📍' : ''); }
  const ll = rec.pts.filter(q => q.corner || q.acc <= S.umbralPrecision).map(q => [q.lat, q.lon]);
  $('sLen').textContent = fmt(Geo.lenLL(ll), 0) + ' m';
  if (p && rec.pts.length > 20 && ll.length) {
    const d = Geo.lenLL([ll[0], [p.lat, p.lon]]);

$('bPause').onclick = () => {

  const first = rec.state === 'ready';
  rec.state = 'rec'; rec.paused = false; paintRec();
  // punto actual: se marca en el mapa y se registra
  rec.pts.push(lastPos); rec.line.addLatLng([lastPos.lat, lastPos.lon]); updRecStats(lastPos);
  markRec(first ? 'inicio' : 'continuar');
  followPos = true; map.setView([lastPos.lat, lastPos.lon], Math.max(map.getZoom(), 19));
  if (lastPos.acc > S.umbralPrecision) toast(`Precisión baja (±${fmt(lastPos.acc, 0)} m): los puntos imprecisos se descartarán.`, 3500);

$('bCorner').onclick = () => {

  if (!lastPos || gpsAge() > 10) return toast('Esperando señal GPS: el indicador de arriba a la izquierda debe estar en verde.', 4000);
  const DUR = 20; let n = DUR;
  rec.avg = { s: [], tm: null };
  $('bCorner').textContent = `⏳ ${n} s`; $('recHint').textContent = 'Quieto en la esquina… promediando el GPS. Toca otra vez para cancelar.';
  try { speak('Esquina. No te muevas', true); } catch { }
  rec.avg.tm = setInterval(() => {
    n--; if (!rec || !rec.avg) return;
    $('bCorner').textContent = `⏳ ${n} s`;
    if (n > 0) return;
    clearInterval(rec.avg.tm); const S0 = rec.avg.s; rec.avg = null;
    if (S0.length < 5) { paintRec(); return toast('Pocas lecturas con buena precisión: esquina no guardada. Inténtalo de nuevo.', 4000); }
    let sw = 0, la = 0, lo = 0; S0.forEach(q => { const w = 1 / (q.acc * q.acc); sw += w; la += q.lat * w; lo += q.lon * w; });
    // la precisión de la media no baja de 1/√n·σ por errores correlados del GPS: se limita a la mitad de la precisión media
    const accMean = S0.reduce((s, q) => s + q.acc, 0) / S0.length, acc = Math.max(Math.sqrt(1 / sw), accMean / 2);
    const c = { lat: la / sw, lon: lo / sw, acc, t: Date.now(), corner: true, n: S0.length };
    rec.pts.push(c); rec.line.addLatLng([c.lat, c.lon]);
    const k = rec.pts.filter(q => q.corner).length;
    L.marker([c.lat, c.lon], { interactive: false, icon: L.divIcon({ className: '', html: `<div class="pin" style="background:#1565c0">${k}</div>`, iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(lyr.tmp);
    paintRec(); updRecStats(); toast(`📍 Esquina ${k} guardada (±${fmt(acc, 1)} m, ${S0.length} lecturas)`, 3000);
    try { speak(`Esquina ${k} guardada`, true); } catch { }
  }, 1000);
};
function markRec(tipo) {
  const p = tipo === 'pausa' ? rec.pts[rec.pts.length - 1] : lastPos; if (!p) return;
  const st = { inicio: ['I', '#2e7d32'], pausa: ['❚❚', '#ef6c00'], continuar: ['▶', '#1565c0'] }[tipo];
  L.marker([p.lat, p.lon], { interactive: false, icon: L.divIcon({ className: '', html: `<div class="pin" style="background:${st[1]}">${st[0]}</div>`, iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(lyr.tmp);
}
$('bCancelRec').onclick = () => rec && rec.pts.length ? confirmSheet('¿Descartar el trazado registrado?', 'Descartar', endRec, true) : endRec();
$('bFin').onclick = () => {
  if (!rec || rec.state === 'ready') return;
  if (rec.avg) return toast('Espera a que termine la esquina (o tócala para cancelar)');
  rec.state = 'pause'; rec.paused = true; paintRec();

}

/* Revisión del resultado antes de guardar */
let review = null;
function startReview(target, mode, pts, r) {
  review = { target, mode, pts, r };
  lyr.tmp.clearLayers();
  L.polyline(pts.filter(p => p.acc <= S.umbralPrecision).map(p => [p.lat, p.lon]), { color: '#ff6f00', weight: 2, opacity: .8, dashArray: '3 4' }).addTo(lyr.tmp);
  L.polygon(r.coords, { color: target === 'linde' ? '#1b5e20' : '#b71c1c', weight: 3, fillColor: target === 'linde' ? '#a5d6a7' : '#757575', fillOpacity: .4 }).addTo(lyr.tmp);
  map.fitBounds(L.latLngBounds(r.coords), { padding: [30, 30], maxZoom: 19 });
  const a = Geo.areaLL(r.coords);
  let warn = [];
  if (r.gap > 15) warn.push(`⚠️ El final queda a ${fmt(r.gap, 0)} m del inicio; se ha cerrado con línea recta.`);
  if (r.selfX) warn.push('⚠️ El polígono se cruza consigo mismo. Revísalo con «Editar».');
  if (r.used < r.total) warn.push(`${r.total - r.used} punto(s) descartados por precisión.`);
  if (r.nCorners) warn.unshift(`📍 ${r.nCorners} esquina(s) promediada(s), precisión media ±${fmt(r.accCorners, 1)} m.`);
  showTool(target === 'linde' ? 'Resultado: linde' : 'Resultado: exclusión',
    `Área ${fmtArea(a)} · Perímetro ${fmt(Geo.perimLL(r.coords), 0)} m · ${r.coords.length} vértices · Precisión media ±${fmt(r.accMed, 1)} m` +
    (r.offset ? ` · Corrección ${fmt(r.offset, 2)} m` : '') + (warn.length ? '<br>' + warn.join('<br>') : ''),
    [['Descartar', 'sec', () => { review = null; lyr.tmp.clearLayers(); showMain(); }],
     ['Guardar', '', async () => {
       await commitPolygon(target, r.coords, { metodo: mode, raw: compactPts(pts), offset: r.offset, accMed: r.accMed });
       review = null; lyr.tmp.clearLayers(); showMain();
     }]]);
}
const compactPts = pts => pts.map(p => p.corner ? [+p.lat.toFixed(8), +p.lon.toFixed(8), +p.acc.toFixed(2), p.t, 'E'] : [+p.lat.toFixed(7), +p.lon.toFixed(7), +p.acc.toFixed(1), p.t]);

async function commitPolygon(target, coords, meta) {
  if (target === 'linde') {
    cur.linde = { coords, ...meta, fecha: Date.now() };
  } else {
    const n = (cur.exclusiones || []).length + 1;
    cur.exclusiones = cur.exclusiones || [];
    cur.exclusiones.push({ id: uid(), nombre: 'Exclusión ' + n, coords, metodo: meta.metodo, fecha: Date.now() });
    checkExclInside(coords);
  }
  await saveCur(); drawFinca(); toast('Guardado');
}
function checkExclInside(coords) {
  if (!cur.linde) return;
  const P = Geo.projFor(cur.linde.coords), L0 = Geo.toXY(cur.linde.coords, P);
  const out = coords.filter(c => !Geo.inPoly(P.fwd(c[0], c[1]), L0)).length;
  if (out) toast(`Aviso: ${out} vértice(s) de la exclusión quedan fuera del linde.`, 4000);
}
async function saveCur() {
  cur.mod = Date.now();
  if (cur.malla && cur.linde) { const r = genArboles(cur); if (!r.error) { cur.malla.arboles = r.arboles; cur.malla.sepFila = r.sepFila; cur.malla.sepFilas = r.sepFilas; } }
  await DB.put(cur);
}

/* =========================================================
   PLANIFICADOR (F2) — finca abierta
   Vueltas perimetrales + pasadas paralelas + giros U / K / Ω
   ========================================================= */
const Planner = (() => {
  const SC = 1000; // Clipper trabaja en enteros (mm)
  const CL = () => window.ClipperLib;
  const toC = xy => xy.map(p => ({ X: Math.round(p[0] * SC), Y: Math.round(p[1] * SC) }));
  const frC = pa => pa.map(q => [q.X / SC, q.Y / SC]);
  const areaP = p => Math.abs(CL().Clipper.Area(p)) / SC / SC;
  const areaC = ps => Math.abs(ps.reduce((s, p) => s + CL().Clipper.Area(p), 0)) / SC / SC;
  function off(paths, d, round, miter = 3) {
    const C = CL(); const co = new C.ClipperOffset(miter, 0.02 * SC);
    co.AddPaths(paths, round ? C.JoinType.jtRound : C.JoinType.jtMiter, C.EndType.etClosedPolygon);
    const s = new C.Paths(); co.Execute(s, d * SC); return s;
  }
  function boolOp(op, a, b) {
    const C = CL(); const c = new C.Clipper();
    c.AddPaths(a, C.PolyType.ptSubject, true); if (b && b.length) c.AddPaths(b, C.PolyType.ptClip, true);
    const s = new C.Paths();
    c.Execute(op === 'diff' ? C.ClipType.ctDifference : op === 'int' ? C.ClipType.ctIntersection : C.ClipType.ctUnion, s, C.PolyFillType.pftNonZero, C.PolyFillType.pftNonZero);
    return s;
  }
  function clipLines(lines, region) {
    const C = CL(); const c = new C.Clipper();
    lines.forEach(l => c.AddPath(toC(l), C.PolyType.ptSubject, false));
    c.AddPaths(region, C.PolyType.ptClip, true);
    const tree = new C.PolyTree();
    c.Execute(C.ClipType.ctIntersection, tree, C.PolyFillType.pftNonZero, C.PolyFillType.pftNonZero);
    return C.Clipper.OpenPathsFromPolyTree(tree).map(frC);
  }
  /* ---- anillos (polilíneas cerradas) ---- */
  function mkRing(xy) { const n = xy.length, cum = [0]; for (let i = 0; i < n; i++) cum.push(cum[i] + Geo.dist(xy[i], xy[(i + 1) % n])); return { xy, cum, L: cum[n] }; }
  function projRing(r, p) {
    let best = { d: Infinity }; const n = r.xy.length;
    for (let i = 0; i < n; i++) {
      const a = r.xy[i], b = r.xy[(i + 1) % n], ab = [b[0] - a[0], b[1] - a[1]], L2 = ab[0] * ab[0] + ab[1] * ab[1] || 1e-12;
      let t = ((p[0] - a[0]) * ab[0] + (p[1] - a[1]) * ab[1]) / L2; t = Math.max(0, Math.min(1, t));
      const q = [a[0] + ab[0] * t, a[1] + ab[1] * t], d = Geo.dist(p, q);
      if (d < best.d) best = { d, q, i, s: r.cum[i] + t * Math.sqrt(L2) };
    }
    return best;
  }
  function ringWalk(r, A, B, wantPath) {

      if (k === 0) parts.push({ type: 'tras', xy: [cur, a] });
      else {
        const E = so.ex[so.seq[k - 1]], N = so.en[v], tr = trans(E, N);
        if (tr.type === 'U' || tr.type === 'K' || tr.type === 'O') { cnt[tr.type]++; parts.push(...turnGeom(E, N, tr.type)); }
        else if (tr.type === 'rodeo') { cnt.rodeo++; const r = obsRings[E.obs]; parts.push({ type: 'giro', xy: [E.p, ...ringWalk(r, projRing(r, E.p), projRing(r, N.p), true).pts, N.p] }); }
        else {
          cnt.tras++;
          if (E.kind === 'hl' && N.kind === 'hl') { const A = pjT(E.p), B = pjT(N.p); parts.push({ type: 'tras', xy: [E.p, ...ringWalk(trRing, A, B, true).pts, N.p] }); }
          else parts.push({ type: 'tras', xy: [E.p, N.p] });
        }
      }
      parts.push({ type: 'trabajo', xy: [a, b], swath: true });
      arrows.push({ xy: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], az: (Math.atan2(b[0] - a[0], b[1] - a[1]) / D2R + 360) % 360 });
    });

    /* estadísticas */
    const L = { trabajo: 0, giro: 0, reversa: 0, tras: 0 };
    parts.forEach(p => { p.len = plen(p.xy); L[p.type] += p.len; });
    const tTrab = L.trabajo / vw, tGiro = (L.giro + L.reversa) / vg + cnt.K * 2 * S.tCambioSentido, tTras = L.tras / vt + cnt.tras * S.tManiobra, tEsq = nCorners * S.tEsquina;
    const tTot = tTrab + tGiro + tTras + tEsq; // s

    /* cobertura teórica */
    const C = CL(), co = new C.ClipperOffset(2, 0.05 * SC);
    parts.filter(p => p.type === 'trabajo').forEach(p => { const xy = p.ring ? p.xy.slice(0, -1) : p.xy; co.AddPath(toC(xy), C.JoinType.jtRound, p.ring ? C.EndType.etClosedLine : C.EndType.etOpenButt); });
    const covered = new C.Paths(); co.Execute(covered, w / 2 * SC);
    const work = obs.length ? boolOp('diff', field, obs) : field;
    const aWork = areaC(work), aCov = areaC(boolOp('int', work, covered));
    const missed = boolOp('diff', work, covered).filter(p => areaP(p) > 0.5 && C.Clipper.Orientation(p));
    const aMiss = Math.max(0, aWork - aCov);
    let aTree = 0;
    if (monte && treeRows && treeRows.length) {
      const co2 = new C.ClipperOffset(2, 0.05 * SC); treeRows.forEach(l => co2.AddPath(toC(l), C.JoinType.jtSquare, C.EndType.etOpenButt));
      const strips = new C.Paths(); co2.Execute(strips, S.holguraTronco * SC);
      aTree = areaC(boolOp('int', work, strips));
    }

    const toLL = xy => Geo.toLL(xy, P).map(q => [+q[0].toFixed(7), +q[1].toFixed(7)]);
    return {
      fecha: Date.now(), geomKey: geomKey(f), az: best.az, nH: hl.length, nHauto, need, ms: Math.round(performance.now() - T0), warn,
      params: { w, s, R, marchaAtras: !!S.marchaAtras, v: S.velocidad, consumo: S.consumo },
      parts: parts.filter(p => p.len > 0.05).map(p => ({ type: p.type, ll: toLL(p.xy), swath: !!p.swath })),
      arrows: arrows.map(a => ({ ll: toLL([a.xy])[0], az: Math.round(a.az) })),
      missed: missed.map(p => toLL(frC(p))),
      stats: {
        nPasadas: sw.segs.length, nVueltas: hl.length, nObs: obsRings.filter(Boolean).length,
        giros: cnt, esquinas: nCorners,
        L: { trabajo: L.trabajo, giro: L.giro, reversa: L.reversa, traslado: L.tras, total: L.trabajo + L.giro + L.reversa + L.tras },
        t: { trabajo: tTrab, giros: tGiro, traslado: tTras, esquinas: tEsq, total: tTot },
        litros: tTot / 3600 * S.consumo,
        area: { objetivo: aWork, cubierta: aCov, noAlcanzada: aMiss, cobertura: aWork ? aCov / aWork : 0, franjaArboles: aTree, coberturaAlcanzable: aWork - aTree > 0 ? Math.min(1, aCov / (aWork - aTree)) : 0 },
        monte,
        haH: aWork / 10000 / (tTot / 3600)
      }
    };
  }
  return { plan, headlandNeed };
})();

function geomKey(f) {
  const s = JSON.stringify([f.linde && f.linde.coords, (f.exclusiones || []).map(e => e.coords)]);
  let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36) + s.length.toString(36);
}

function drawPlan(pl, layer) {
  layer.clearLayers();

  if (CFG.noAlc) pl.missed.forEach(m => L.polygon(m, { color: '#ef6c00', weight: 1, fillColor: '#ff9800', fillOpacity: .55, interactive: false }).addTo(layer));
  pl.parts.forEach(p => L.polyline(p.ll, { ...PLAN_STYLE[p.type], interactive: false }).addTo(layer));
  pl.arrows.forEach(a => L.marker(a.ll, { interactive: false, icon: L.divIcon({ className: '', html: `<div class="arr" style="transform:rotate(${a.az}deg)"></div>`, iconSize: [12, 12], iconAnchor: [6, 6] }) }).addTo(layer));
  const all = pl.parts; if (!all.length) return;
  const st = all[0].ll[0], en = all[all.length - 1].ll[all[all.length - 1].ll.length - 1];
  L.marker(st, { interactive: false, icon: L.divIcon({ className: '', html: '<div class="pin" style="background:#2e7d32">I</div>', iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(layer);

}

    <button class="btn" id="oGo">Calcular</button>`,

        o.az = parseFloat($('oAz').value.replace(',', '.')) || 0; o.nH = parseInt($('oNHv').value) || 0;

        if (o.start === 'map') { pickStart(o); return; }
        let st = null;

function pickStart(o) {
  planRev = { picking: true };
  showTool('Punto de inicio', 'Toca en el mapa el punto por donde entra el tractor a la finca.', [['Cancelar', 'sec', () => { map.off('click', onPick); planRev = null; showMain(); }]]);
  function onPick(e) { map.off('click', onPick); planRev = null; runPlan(o, [e.latlng.lat, e.latlng.lng]); }
  map.on('click', onPick);
}
function runPlan(o, start) {
  const ov = document.createElement('div'); ov.className = 'busyOv'; ov.innerHTML = '<div>Calculando plan…<br><small>Optimizando dirección y orden de pasadas</small></div>'; document.body.appendChild(ov);
  setTimeout(() => {

}

}

function utm(lat, lon, zone) {
  const a = 6378137, f = 1 / 298.257223563, e2 = f * (2 - f), ep2 = e2 / (1 - e2), k0 = 0.9996;
  zone = zone || Math.floor((lon + 180) / 6) + 1;
  const l0 = ((zone - 1) * 6 - 180 + 3) * D2R, phi = lat * D2R, lam = lon * D2R;
  const N = a / Math.sqrt(1 - e2 * Math.sin(phi) ** 2), T = Math.tan(phi) ** 2, C = ep2 * Math.cos(phi) ** 2, A = Math.cos(phi) * (lam - l0);
  const M = a * ((1 - e2 / 4 - 3 * e2 ** 2 / 64 - 5 * e2 ** 3 / 256) * phi - (3 * e2 / 8 + 3 * e2 ** 2 / 32 + 45 * e2 ** 3 / 1024) * Math.sin(2 * phi) + (15 * e2 ** 2 / 256 + 45 * e2 ** 3 / 1024) * Math.sin(4 * phi) - (35 * e2 ** 3 / 3072) * Math.sin(6 * phi));
  const x = k0 * N * (A + (1 - T + C) * A ** 3 / 6 + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * A ** 5 / 120) + 500000;
  let y = k0 * (M + N * Math.tan(phi) * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * A ** 4 / 24 + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * A ** 6 / 720));
  if (lat < 0) y += 1e7;
  return [x, y, zone];
}
function download(name, text, type) {

  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function buildDXF({ f, real }) {
  const zone = Math.floor((f.linde.coords[0][1] + 180) / 6) + 1;
  const U = ll => utm(ll[0], ll[1], zone);
  const out = ['0', 'SECTION', '2', 'HEADER', '9', '$INSUNITS', '70', '6', '0', 'ENDSEC', '0', 'SECTION', '2', 'TABLES', '0', 'TABLE', '2', 'LAYER', '70', '10'];
  const layers = [['LINDE', 3], ['EXCLUSIONES', 8], ['ARBOLES', 94], ['PLAN_TRABAJO', 5], ['PLAN_GIROS', 4], ['PLAN_MARCHA_ATRAS', 4], ['PLAN_TRASLADOS', 151], ['REAL_TRABAJO', 6], ['REAL_LEVANTADO', 216], ['DESVIOS', 1], ['TEXTOS', 7]];
  layers.forEach(([n, c]) => out.push('0', 'LAYER', '2', n, '70', '0', '62', String(c), '6', 'CONTINUOUS'));
  out.push('0', 'ENDTAB', '0', 'ENDSEC', '0', 'SECTION', '2', 'ENTITIES');
  const pl = (ll, layer, closed) => { out.push('0', 'POLYLINE', '8', layer, '66', '1', '70', closed ? '1' : '0'); ll.forEach(p => { const [x, y] = U(p); out.push('0', 'VERTEX', '8', layer, '10', x.toFixed(3), '20', y.toFixed(3), '30', '0'); }); out.push('0', 'SEQEND', '8', layer); };
  pl(f.linde.coords, 'LINDE', true);
  (f.exclusiones || []).forEach(e => pl(e.coords, 'EXCLUSIONES', true));
  if (f.malla && f.malla.arboles) f.malla.arboles.forEach(a => { if (a[4]) return; const [x, y] = U(a); out.push('0', 'CIRCLE', '8', 'ARBOLES', '10', x.toFixed(3), '20', y.toFixed(3), '30', '0', '40', '0.3'); });
  if (f.plan) f.plan.parts.forEach(p => pl(p.ll, { trabajo: 'PLAN_TRABAJO', giro: 'PLAN_GIROS', reversa: 'PLAN_MARCHA_ATRAS', tras: 'PLAN_TRASLADOS' }[p.type], false));
  real.forEach(run => {
    let cur_ = [], st = null;
    const flush = () => { if (cur_.length > 1) pl(cur_, st ? 'REAL_TRABAJO' : 'REAL_LEVANTADO', false); };
    run.forEach(q => { if (st !== q.on && cur_.length) { flush(); cur_ = [cur_[cur_.length - 1]]; } st = q.on; cur_.push(q.ll); }); flush();
    let d = [];
    run.forEach(q => { if (q.flag) d.push(q.ll); else { if (d.length > 1) pl(d, 'DESVIOS', false); d = []; } }); if (d.length > 1) pl(d, 'DESVIOS', false);
  });
  const c = U(f.linde.coords[0]);
  out.push('0', 'TEXT', '8', 'TEXTOS', '10', c[0].toFixed(3), '20', (c[1] + 3).toFixed(3), '30', '0', '40', '2', '1', `${f.nombre} - ETRS89 UTM ${zone}N - ${fmtArea(Geo.areaLL(f.linde.coords))}`);
  out.push('0', 'ENDSEC', '0', 'EOF');
  return out.join('\r\n');
}
function buildKML({ f, t, real }) {

  const ring = ll => c([...ll, ll[0]]);
  const sty = (id, line, w, fill) => `<Style id="${id}"><LineStyle><color>${line}</color><width>${w}</width></LineStyle><PolyStyle><color>${fill || '00000000'}</color></PolyStyle></Style>`;
  const pm = (name, st, geom) => `<Placemark><name>${esc(name)}</name><styleUrl>#${st}</styleUrl>${geom}</Placemark>`;
  const ls = ll => `<LineString><tessellate>1</tessellate><coordinates>${c(ll)}</coordinates></LineString>`;
  let k = `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${esc(f.nombre)}</name>` +
    sty('linde', 'ff205e1b', 3, '66a7d6a5') + sty('excl', 'ff1c1cb7', 2, '99757575') + sty('plan', 'ffc06515', 2) + sty('giro', 'ffe5881e', 1) + sty('tras', 'fff6b564', 1) + sty('real', 'ffa21f7b', 3) + sty('lev', '99a21f7b', 1) + sty('desv', 'ff0000d5', 4);
  k += `<Folder><name>Finca</name>` + pm('Linde', 'linde', `<Polygon><outerBoundaryIs><LinearRing><coordinates>${ring(f.linde.coords)}</coordinates></LinearRing></outerBoundaryIs></Polygon>`);
  (f.exclusiones || []).forEach(e => k += pm(e.nombre, 'excl', `<Polygon><outerBoundaryIs><LinearRing><coordinates>${ring(e.coords)}</coordinates></LinearRing></outerBoundaryIs></Polygon>`));
  if (f.malla && f.malla.arboles) k += pm('Árboles', 'linde', `<MultiGeometry>${f.malla.arboles.filter(a => !a[4]).map(a => `<Point><coordinates>${a[1]},${a[0]},0</coordinates></Point>`).join('')}</MultiGeometry>`);
  k += '</Folder>';
  if (f.plan) k += `<Folder><name>Plan (ideal)</name>${f.plan.parts.map((p, i) => pm(`${i + 1} ${p.type}`, p.type === 'trabajo' ? 'plan' : p.type === 'tras' ? 'tras' : 'giro', ls(p.ll))).join('')}</Folder>`;
  if (real.length) {
    k += `<Folder><name>Real ${t ? new Date(t.inicio).toLocaleDateString('es-ES') : ''}</name>`;
    real.forEach((run, i) => { k += pm('Sesión ' + (i + 1), 'real', ls(run.map(q => q.ll))); let d = []; run.forEach(q => { if (q.flag) d.push(q.ll); else { if (d.length > 1) k += pm('Desvío', 'desv', ls(d)); d = []; } }); if (d.length > 1) k += pm('Desvío', 'desv', ls(d)); });

}
function buildGPX({ f, t }) {

/* =========================================================
   F3 — TRABAJO EN TIEMPO REAL
   Registro, posición de corte, cobertura, desviaciones, indicadores
   ========================================================= */

/* ---- Rejilla de cobertura (celdas de 0,25 m) ---- */
function Grid(f) {
  const P = Geo.projFor(f.linde.coords);
  const lin = Geo.toXY(f.linde.coords, P), exs = (f.exclusiones || []).map(e => Geo.toXY(e.coords, P));
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  lin.forEach(p => { x0 = Math.min(x0, p[0]); y0 = Math.min(y0, p[1]); x1 = Math.max(x1, p[0]); y1 = Math.max(y1, p[1]); });
  x0 -= 4; y0 -= 4; x1 += 4; y1 += 4;
  let cs = 0.25; while (((x1 - x0) / cs) * ((y1 - y0) / cs) > 4e6) cs *= 2;
  const cols = Math.ceil((x1 - x0) / cs), rows = Math.ceil((y1 - y0) / cs), N = cols * rows;
  const mask = new Uint8Array(N), cnt = new Uint8Array(N), lastT = new Float32Array(N).fill(-1e9);
  const fill = (poly, val) => {
    for (let r = 0; r < rows; r++) {
      const y = y0 + (r + .5) * cs, xs = [];
      for (let i = 0, n = poly.length; i < n; i++) { const a = poly[i], b = poly[(i + 1) % n]; if ((a[1] > y) !== (b[1] > y)) xs.push(a[0] + (y - a[1]) * (b[0] - a[0]) / (b[1] - a[1])); }
      xs.sort((a, b) => a - b);
      for (let k = 0; k + 1 < xs.length; k += 2) {
        const c0 = Math.max(0, Math.ceil((xs[k] - x0) / cs - .5)), c1 = Math.min(cols - 1, Math.floor((xs[k + 1] - x0) / cs - .5));
        for (let c = c0; c <= c1; c++) mask[r * cols + c] = val;
      }
    }
  };
  fill(lin, 1); exs.forEach(e => fill(e, 0));
  let nMask = 0; for (let i = 0; i < N; i++) nMask += mask[i];
  const g = { P, x0, y0, cs, cols, rows, mask, cnt, nMask, nClean: 0, nOver: 0 };
  g.stamp = (a, b, w, t) => {
    const r = w / 2, r2 = r * r;
    const c0 = Math.max(0, Math.floor((Math.min(a[0], b[0]) - r - x0) / cs)), c1 = Math.min(cols - 1, Math.floor((Math.max(a[0], b[0]) + r - x0) / cs));
    const r0 = Math.max(0, Math.floor((Math.min(a[1], b[1]) - r - y0) / cs)), r1 = Math.min(rows - 1, Math.floor((Math.max(a[1], b[1]) + r - y0) / cs));
    const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy || 1e-12;
    for (let rr = r0; rr <= r1; rr++) {
      const y = y0 + (rr + .5) * cs;
      for (let c = c0; c <= c1; c++) {
        const x = x0 + (c + .5) * cs;
        let tt = ((x - a[0]) * dx + (y - a[1]) * dy) / L2; tt = tt < 0 ? 0 : tt > 1 ? 1 : tt;
        const ex = x - a[0] - tt * dx, ey = y - a[1] - tt * dy;
        if (ex * ex + ey * ey > r2) continue;
        const k = rr * cols + c;
        if (t - lastT[k] > 15) { const v = cnt[k]; if (v < 255) { cnt[k] = v + 1; if (mask[k]) { if (v === 0) g.nClean++; else if (v === 1) g.nOver++; } } }
        lastT[k] = t;
      }
    }
  };
  g.areas = () => ({ objetivo: g.nMask * cs * cs, limpia: g.nClean * cs * cs, solape: g.nOver * cs * cs });
  let cv = null;
  g.render = cfg => {
    if (!cv) { cv = document.createElement('canvas'); cv.width = cols; cv.height = rows; }
    const ctx = cv.getContext('2d'), im = ctx.createImageData(cols, rows), d = im.data;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const k = r * cols + c, v = cnt[k], o = ((rows - 1 - r) * cols + c) * 4;
      let col = null;
      if (v >= 2 && cfg.solape) col = [253, 216, 53, 185];
      else if (v >= 1 && cfg.limpia) col = [27, 94, 32, 150];
      else if (v === 0 && mask[k] && cfg.pendiente) col = [110, 110, 110, 120];
      if (col) { d[o] = col[0]; d[o + 1] = col[1]; d[o + 2] = col[2]; d[o + 3] = col[3]; }
    }
    ctx.putImageData(im, 0, 0); return cv.toDataURL();
  };
  g.bounds = () => { const a = P.inv(x0, y0), b = P.inv(x0 + cols * cs, y0 + rows * cs); return [[a[0], a[1]], [b[0], b[1]]]; };
  return g;
}

/* ---- Seguimiento: posición de corte, desviación, longitudes ---- */
function Tracker(g, plan, S, t0) {

  let acc0 = 0;
  if (plan) plan.parts.forEach((p, k) => { const xy = Geo.toXY(p.ll, P); for (let i = 1; i < xy.length; i++) { segs.push([xy[i - 1][0], xy[i - 1][1], xy[i][0], xy[i][1]]); cum.push(acc0); segPart.push(k); acc0 += Geo.dist(xy[i - 1], xy[i]); } partEnd[k] = acc0; });
  let lastIdx = -1;
  const st = { buf: [], h: null, lastCut: null, lastP: null, L: 0, Lon: 0, Ldev: 0, devSum: 0, devMax: 0, Lplan: 0, tOn: 0, hasPlan: segs.length > 0 };
  // se compara con el tramo del plan que toca (ventana a lo largo del plan); si se pierde, búsqueda global
  function search(p, i0, i1) {

  w.trab.resumen = resumenTrab(w.trab, w);
  clearInterval(w.tRender); clearInterval(w.tSave);
  if (w.trab.sesiones.length) await DB.tPut(w.trab); else await DB.tDel(w.trab.id);
  work = null; keepAwake(false); followPos = false; document.body.classList.remove('hc'); try { speechSynthesis.cancel(); } catch { }
  $('pWork').classList.add('hidden'); $('bLoc').classList.remove('hidden'); showMain();
  trabCache = null; drawFinca();
  if (w.trab.sesiones.length) resumenSheet(w.trab);
}

/* ---- Repostajes y calibración del consumo ---- */
async function horasDesde(ts) {
  let h = 0;
  for (const t of await DB.tAll()) for (const s of t.sesiones) if (s.inicio >= ts) h += Math.max(0, (s.fin || s.inicio) - s.inicio) / 3.6e6;
  return h;
}
async function repostajeSheet() {
  const R = (await DB.kvGet('repostajes')) || { base: null, hist: [] };
  const h = R.base ? await horasDesde(R.base) : 0;
  sheet(`<h3>Repostaje</h3>
    ${R.base ? `<div class="note">Desde el último lleno (${new Date(R.base).toLocaleString('es-ES')}): <b>${fmtH(h)}</b> de motor registradas.</div>`
      : `<div class="note">Primer registro: llena el depósito y pulsa «Guardar» (sin litros). Desde ese momento se contarán las horas de trabajo.</div>`}
    <label class="f">Litros repostados hasta llenar</label><input class="inp" id="rL" inputmode="decimal" placeholder="${R.base ? 'p. ej. 18,5' : 'vacío en el primer lleno'}">
    <button class="btn" id="rOk" style="margin-top:12px">Guardar</button>
    ${R.hist.length ? '<div class="sgrp">Historial</div><div class="card">' + R.hist.slice(-8).reverse().map(x => `<div class="kv"><span>${new Date(x.fecha).toLocaleDateString('es-ES')} · ${fmt(x.litros, 1)} L · ${fmtH(x.horas)}</span><span>${fmt(x.lh, 2)} L/h</span></div>`).join('') + '</div>' : ''}`,
    () => {
      $('rOk').onclick = async () => {
        const l = parseFloat($('rL').value.replace(',', '.'));
        const now = Date.now();
        if (R.base && isFinite(l) && l > 0) {
          if (h < 0.25) return toast('Muy pocas horas registradas para calibrar (mín. 15 min)');
          R.hist.push({ fecha: now, litros: l, horas: h, lh: l / h });
          if (S.consumoAuto) { const last = R.hist.slice(-5); S.consumo = +(last.reduce((s, x) => s + x.litros, 0) / last.reduce((s, x) => s + x.horas, 0)).toFixed(2); await DB.kvPut('settings', S); }
          toast(`Consumo medido: ${fmt(l / h, 2)} L/h` + (S.consumoAuto ? ` · aplicado ${fmt(S.consumo, 2)} L/h` : ''), 4000);
        } else toast('Depósito lleno registrado');
        R.base = now; await DB.kvPut('repostajes', R); closeSheet();
      };
    });
}

/* =========================================================
   F4 — MONTE / PLANTACIÓN: malla de árboles
   ========================================================= */
function mallaVec(f, P) {
  const M = f.malla, A = P.fwd(M.A[0], M.A[1]), B = P.fwd(M.B[0], M.B[1]), C = P.fwd(M.C[0], M.C[1]);
  let ab = [(B[0] - A[0]) / (M.nAB - 1), (B[1] - A[1]) / (M.nAB - 1)], ac = [(C[0] - A[0]) / (M.nAC - 1), (C[1] - A[1]) / (M.nAC - 1)];
  if (M.nominal) { const a = Geo.nrm(ab), c = Geo.nrm(ac); ab = [a[0] * S.mallaY, a[1] * S.mallaY]; ac = [c[0] * S.mallaX, c[1] * S.mallaX]; }
  return { A, ab, ac };
}
function genArboles(f) {
  const P = Geo.projFor(f.linde.coords), { A, ab, ac } = mallaVec(f, P);
  const det = ab[0] * ac[1] - ab[1] * ac[0];
  if (Math.abs(det) < 1e-6) return { error: 'Los árboles B y C están alineados con A: elige C en la otra dirección.' };
  const lin = Geo.toXY(f.linde.coords, P), exs = (f.exclusiones || []).map(e => Geo.toXY(e.coords, P));
  const ij = v => { const x = v[0] - A[0], y = v[1] - A[1]; return [(x * ac[1] - y * ac[0]) / det, (ab[0] * y - ab[1] * x) / det]; };
  let i0 = Infinity, i1 = -Infinity, j0 = Infinity, j1 = -Infinity;
  lin.forEach(v => { const [i, j] = ij(v); i0 = Math.min(i0, i); i1 = Math.max(i1, i); j0 = Math.min(j0, j); j1 = Math.max(j1, j); });
  if ((i1 - i0) * (j1 - j0) > 200000) return { error: 'Malla demasiado grande: revisa los árboles marcados y los recuentos.' };
  const faltas = new Set(f.malla.faltas || []), out = [];
  // la plantación es el paralelogramo A–B–C definido por los árboles de esquina
  i0 = Math.max(i0, 0); i1 = Math.min(i1, f.malla.nAB - 1); j0 = Math.max(j0, 0); j1 = Math.min(j1, f.malla.nAC - 1);
  for (let i = Math.ceil(i0 - 1e-6); i <= Math.floor(i1 + 1e-6); i++) for (let j = Math.ceil(j0 - 1e-6); j <= Math.floor(j1 + 1e-6); j++) {
    const p = [A[0] + i * ab[0] + j * ac[0], A[1] + i * ab[1] + j * ac[1]];
    if (!Geo.inPoly(p, lin) || exs.some(e => Geo.inPoly(p, e))) continue;
    const ll = P.inv(p[0], p[1]);
    out.push([+ll[0].toFixed(7), +ll[1].toFixed(7), i, j, faltas.has(i + ',' + j) ? 1 : 0]);
  }
  return { arboles: out, sepFila: Math.hypot(...ab), sepFilas: Math.abs((ab[0] * ac[1] - ab[1] * ac[0]) / Math.hypot(...ab)) };
}
function drawArboles(f, layer) {
  if (!f.malla || !f.malla.arboles) return;
  const ren = L.canvas({ padding: .3 });
  f.malla.arboles.forEach(a => L.circle([a[0], a[1]], a[4]
    ? { renderer: ren, radius: 0.5, color: '#9e9e9e', weight: 1.5, fill: false, interactive: false }
    : { renderer: ren, radius: 0.55, color: '#fff', weight: 0.8, fillColor: '#33691e', fillOpacity: 1, interactive: false }).addTo(layer));
}

let mallaW = null;
function mallaMenu() {
  if (busy()) return;
  if (!cur.linde) return toast('Primero define el linde de la finca');
  const M = cur.malla;
  if (!M) return mallaWizard();
  const n = M.arboles.length, nf = M.arboles.filter(a => a[4]).length;
  sheet(`<h3>Malla de árboles</h3>
    <div class="card">
      <div class="kv"><span>Árboles</span><span>${n - nf}${nf ? ' (+' + nf + ' faltas)' : ''}</span></div>
      <div class="kv"><span>Separación en fila (medida)</span><span>${fmt(M.sepFila, 2)} m</span></div>
      <div class="kv"><span>Separación entre filas (medida)</span><span>${fmt(M.sepFilas, 2)} m</span></div>
      <div class="kv"><span>Ajuste</span><span>${M.nominal ? 'Nominal ' + fmt(S.mallaX, 1) + ' × ' + fmt(S.mallaY, 1) : 'Medido'}</span></div>
    </div>
    <button class="opt" id="mFal">✖️ Marcar / desmarcar faltas<small>Árboles que no existen. No cambian las calles.</small></button>
    <button class="opt" id="mRe">🔄 Redefinir malla</button>
    <button class="opt" id="mDel" style="color:var(--err)">🗑 Borrar malla</button>`,
    () => {
      $('mFal').onclick = () => { closeSheet(); faltasMode(); };
      $('mRe').onclick = () => { closeSheet(); mallaWizard(); };
      $('mDel').onclick = () => confirmSheet('¿Borrar la malla de árboles?', 'Borrar', async () => { cur.malla = null; await saveCur(); drawFinca(); }, true);
    });
}
function mallaWizard() {
  mallaW = { pts: [], step: 0, avg: null };
  map.on('click', mallaClick); mallaStep();
}
const MALLA_TXT = [
  ['Árbol A', 'Árbol de una ESQUINA de la plantación.'],
  ['Árbol B', 'Último árbol de la MISMA FILA que A (dirección de trabajo).'],
  ['Árbol C', 'Último árbol en la OTRA dirección, en la misma columna que A.']
];
function mallaStep() {
  const k = mallaW.step;
  lyr.tmp.clearLayers();
  mallaW.pts.forEach((p, i) => L.marker(p, { icon: L.divIcon({ className: '', html: `<div class="pin" style="background:#33691e">${'ABC'[i]}</div>`, iconSize: [22, 22], iconAnchor: [11, 11] }) }).addTo(lyr.tmp));
  if (mallaW.pts.length > 1) L.polyline([mallaW.pts[0], mallaW.pts[1]], { color: '#33691e', dashArray: '4 4' }).addTo(lyr.tmp);
  if (mallaW.pts.length > 2) L.polyline([mallaW.pts[0], mallaW.pts[2]], { color: '#33691e', dashArray: '4 4' }).addTo(lyr.tmp);
  showTool(MALLA_TXT[k][0] + ' (' + (k + 1) + '/3)', MALLA_TXT[k][1] + '<br>Toca el árbol en la ortofoto o colócate junto al tronco y pulsa «GPS».',
    [['Cancelar', 'sec', mallaCancel], ['Atrás', 'sec', () => { if (mallaW.avg) return; mallaW.pts.pop(); mallaW.step = Math.max(0, mallaW.step - 1); mallaStep(); }, k === 0], ['GPS (15 s)', '', mallaGPS]]);
}
function mallaCancel() { if (mallaW && mallaW.avg) clearInterval(mallaW.avg); map.off('click', mallaClick); mallaW = null; lyr.tmp.clearLayers(); showMain(); }
function mallaClick(e) { if (!mallaW || mallaW.avg) return; mallaSet([e.latlng.lat, e.latlng.lng]); }
function mallaGPS() {
  startGPS(); const S0 = []; let n = 15;
  $('toolHint').innerHTML = 'Promediando GPS… 15 s. No te muevas.';
  mallaW.avg = setInterval(() => {
    if (lastPos && lastPos.acc <= S.umbralPrecision) S0.push(lastPos);
    n--; $('toolHint').innerHTML = `Promediando GPS… ${n} s · ${S0.length} lecturas`;
    if (n <= 0) {
      clearInterval(mallaW.avg); mallaW.avg = null;
      if (S0.length < 3) { toast('Precisión GPS insuficiente; toca el árbol en el mapa'); return mallaStep(); }
      let sw = 0, la = 0, lo = 0; S0.forEach(p => { const w = 1 / (p.acc * p.acc); sw += w; la += p.lat * w; lo += p.lon * w; });
      toast(`Posición promediada (±${fmt(Math.sqrt(1 / sw), 1)} m)`);
      mallaSet([la / sw, lo / sw]);
    }
  }, 1000);
}
function mallaSet(ll) {
  mallaW.pts.push(ll); mallaW.step++;
  if (mallaW.step < 3) return mallaStep();
  map.off('click', mallaClick);
  const [A, B, C] = mallaW.pts, dAB = Geo.lenLL([A, B]), dAC = Geo.lenLL([A, C]);
  const old = cur.malla;
  const nAB0 = Math.max(2, Math.round(dAB / S.mallaY) + 1), nAC0 = Math.max(2, Math.round(dAC / S.mallaX) + 1);
  sheet(`<h3>Recuento de árboles</h3>
    <div class="note">A–B mide ${fmt(dAB, 1)} m · A–C mide ${fmt(dAC, 1)} m.</div>
    <div class="srow"><span>Árboles en la fila A–B (contando A y B)</span><input class="inp" id="mAB" inputmode="numeric" value="${nAB0}" style="width:80px;text-align:right"></div>
    <div class="srow"><span>Árboles en la columna A–C (contando A y C)</span><input class="inp" id="mAC" inputmode="numeric" value="${nAC0}" style="width:80px;text-align:right"></div>
    <div class="note" id="mSep"></div>
    <div class="srow"><span>Usar separación nominal (${fmt(S.mallaX, 1)} × ${fmt(S.mallaY, 1)} m) con la orientación medida</span><input type="checkbox" id="mNom" ${old && old.nominal ? 'checked' : ''} style="width:auto"></div>
    <div class="row" style="margin-top:12px"><button class="btn sec" id="mCan">Cancelar</button><button class="btn" id="mOk">Generar malla</button></div>`,
    () => {
      const upd = () => { const a = parseInt($('mAB').value), c = parseInt($('mAC').value); if (a > 1 && c > 1) { const sa = dAB / (a - 1), sc = dAC / (c - 1); const bad = Math.abs(sa - S.mallaY) / S.mallaY > .15 || Math.abs(sc - S.mallaX) / S.mallaX > .15; $('mSep').innerHTML = `Separación medida: ${fmt(sa, 2)} m en fila · ${fmt(sc, 2)} m entre filas${bad ? '<br><span style="color:var(--warn)">⚠️ Difiere más de un 15 % de la nominal: revisa los recuentos.</span>' : ''}`; } };
      $('mAB').oninput = $('mAC').oninput = upd; upd();
      $('mCan').onclick = () => { closeSheet(); mallaCancel(); };
      $('mOk').onclick = async () => {
        const nAB = parseInt($('mAB').value), nAC = parseInt($('mAC').value);
        if (!(nAB > 1 && nAC > 1)) return toast('Recuentos no válidos (mínimo 2)');
        const tmp = { ...cur, malla: { A, B, C, nAB, nAC, nominal: $('mNom').checked, faltas: [] } };
        const r = genArboles(tmp); if (r.error) return toast(r.error, 4000);
        cur.malla = { ...tmp.malla, arboles: r.arboles, sepFila: r.sepFila, sepFilas: r.sepFilas };
        await saveCur(); closeSheet(); mallaW = null; lyr.tmp.clearLayers(); showMain(); drawFinca();
        toast(`${r.arboles.length} árboles en la malla`);
      };
    });
}
function faltasMode() {
  const set = new Set(cur.malla.faltas || []);
  const onC = e => {
    const P = Geo.projFor(cur.linde.coords), q = P.fwd(e.latlng.lat, e.latlng.lng);
    let bi = -1, bd = Infinity; cur.malla.arboles.forEach((a, i) => { const d = Geo.dist(q, P.fwd(a[0], a[1])); if (d < bd) { bd = d; bi = i; } });
    if (bi < 0 || bd > 1.6) return;
    const a = cur.malla.arboles[bi], k = a[2] + ',' + a[3];
    if (set.has(k)) { set.delete(k); a[4] = 0; } else { set.add(k); a[4] = 1; }
    lyr.finca.clearLayers(); drawArboles(cur, lyr.finca);
  };
  map.on('click', onC);
  const fin = async save => { map.off('click', onC); if (save) { cur.malla.faltas = [...set]; await saveCur(); } else { const r = genArboles(cur); cur.malla.arboles = r.arboles; } showMain(); drawFinca(); };
  showTool('Faltas de árboles', 'Toca un árbol para marcarlo como falta (gris) o volver a activarlo.', [['Cancelar', 'sec', () => fin(false)], ['Guardar', '', () => fin(true)]]);
}

/* ---------- Panel de herramienta genérico ---------- */
function showTool(title, hint, btns) {
  $('tbMain').classList.add('hidden'); $('pRec').classList.add('hidden'); $('pTool').classList.remove('hidden');
  $('toolTitle').textContent = title; $('toolHint').innerHTML = hint;

}
